<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blue Cranes Online</title>
<meta name="theme-color" content="#0B3575">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blue Cranes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="shared/firebase-config.js"></script>
<script type="module" src="shared/cloud.js"></script>
<script src="shared/app.js"></script>
<style>
  :root{--ink:#2B2C30;--ground:#EEF2F7;--card:#fff;--line:#D9E0EA;--field:#AEB8C7;--navy:#21457F;--navyDeep:#0B3575;--yellow:#FBD220;--yellowDark:#F5B826;--muted:#566070;--label:#343A44;--ok:#15703D;--bad:#A12A1F}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
  body{min-height:100vh}
  .app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--navyDeep);color:#fff;border-bottom:4px solid var(--yellow);padding:calc(18px + env(safe-area-inset-top)) 16px 18px;display:flex;align-items:center;gap:14px}
  header.big{flex-direction:column;text-align:center;padding-top:calc(30px + env(safe-area-inset-top));padding-bottom:22px;gap:10px}
  .logo{width:56px;height:56px;border-radius:50%;background:#fff;flex-shrink:0}
  header.big .logo{width:92px;height:92px}
  .sub{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#C9D5EA}
  h1,h2{font-family:Montserrat,sans-serif;font-weight:900;margin:0;text-transform:uppercase}
  h1{font-size:22px;line-height:1.15} h2{font-size:16px;color:var(--navyDeep)}
  main{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label,.lab{font-size:13px;font-weight:600;color:var(--label)}
  .field input{height:52px;border-radius:10px;border:1.5px solid var(--field);background:#fff;padding:0 14px;font-size:17px;font-family:inherit;color:var(--ink);width:100%}
  .hint{font-size:12px;color:var(--muted)} .warn{font-size:13px;color:var(--bad);font-weight:600}
  .btn{height:52px;border-radius:12px;border:0;font-weight:700;font-size:16px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%;padding:0 14px;text-decoration:none}
  .primary{background:var(--yellow);color:var(--navyDeep);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
  .primary:disabled{background:#E8DCA0}
  .secondary{background:#fff;color:var(--navyDeep);border:2px solid var(--navy)}
  .link{border:0;background:none;color:var(--navy);font-weight:700;font-size:14px;font-family:inherit;padding:10px;cursor:pointer}
  button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--yellowDark);outline-offset:2px}
  .sig{position:relative;border:1.5px dashed var(--field);border-radius:10px;background:#FAFBFD;height:150px}
  .sig canvas{width:100%;height:100%;display:block;touch-action:none;border-radius:10px}
  .sig .ph{position:absolute;left:12px;bottom:10px;font-size:13px;color:#98A2B5;pointer-events:none}
  .row{display:flex;gap:10px}
  .row .btn{height:44px;font-size:14px;border-width:1.5px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);min-height:150px;box-shadow:0 1px 3px rgba(11,53,117,.06)}
  .tile:hover{border-color:var(--field)}
  .tile .ic{width:52px;height:52px;border-radius:14px;background:var(--navyDeep);color:var(--yellow);display:flex;align-items:center;justify-content:center}
  .tile b{font-family:Montserrat,sans-serif;font-weight:800;font-size:15px;color:var(--navyDeep);text-transform:uppercase;line-height:1.2}
  .tile span{font-size:12.5px;color:var(--muted);line-height:1.35}
  .me{display:flex;align-items:center;gap:12px}
  .me img{height:44px;max-width:120px;object-fit:contain;background:#FAFBFD;border:1px solid var(--line);border-radius:8px;padding:2px 6px}
  .status{font-size:12px;color:var(--muted);text-align:center}
  .toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navyDeep);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:10;max-width:90%}
</style>
</head>
<body>
<div class="app" id="app"><header class="big"><img class="logo" src="icons/logo.png" alt="Blue Cranes"><div class="sub">Blue Cranes</div><h1>Online</h1></header><main><div class="status">Loading…</div></main></div>
<script>
(function(){
  'use strict';
  // ---------- the tools on the home screen: add new ones here ----------
  const TOOLS = [
    { href:'timesheet/', name:'Daily Time Sheet', text:'Vehicle check, jobs, km and hours. PDF and WhatsApp.',
      icon:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>' },
    { href:'forklift/', name:'Forklift Inspection', text:'Inspection and load test reports with certificate.',
      icon:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18V6h5l3 6v6"/><path d="M12 12h3"/><path d="M17 4v14h4"/><circle cx="6" cy="19" r="2"/><circle cx="12" cy="19" r="2"/></svg>' }
  ];

  const app = document.getElementById('app');
  const S = { view:'loading', mode:'in', email:'', user:null, profile:null, cloud:false, sig:null };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let tt; function toast(m){ let t = document.querySelector('.toast'); if (!t){ t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent = m; clearTimeout(tt); tt = setTimeout(() => t.remove(), 2600); }
  const big = (t) => `<header class="big"><img class="logo" src="icons/logo.png" alt="Blue Cranes"><div class="sub">Blue Cranes</div><h1>${t}</h1></header>`;

  // ---------- views ----------
  function vAuth(){
    const m = S.mode;
    return big('Online') + `<main><form id="authForm" class="card" onsubmit="return false">
      <h2>${m==='up' ? 'Create your account' : m==='reset' ? 'Reset password' : 'Sign in'}</h2>
      <div class="field"><label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email" inputmode="email" value="${esc(S.email)}"></div>
      ${m==='reset' ? '' : `<div class="field"><label for="aPw">Password</label><input id="aPw" type="password" autocomplete="${m==='up'?'new-password':'current-password'}">${m==='up' ? '<span class="hint">At least 6 characters.</span>' : ''}</div>`}
      ${m==='up' ? profileFields({}) : ''}
      <div id="err" class="warn" role="alert"></div>
      <button class="btn primary" type="button" id="go">${m==='up' ? 'Create account' : m==='reset' ? 'Send reset email' : 'Sign in'}</button>
      ${m==='in' ? `<button class="btn secondary" type="button" data-mode="up">New here? Create an account</button><button type="button" class="link" data-mode="reset">Forgot password?</button>`
        : `<button class="btn secondary" type="button" data-mode="in">Back to sign in</button>`}
    </form><div class="status">One sign-in for all Blue Cranes tools.</div></main>`;
  }
  function profileFields(p){
    return `<div style="border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:14px">
      <h2>Your technician profile</h2>
      <span class="hint" style="margin-top:-8px">Your name and signature go on your time sheets and inspection reports.</span>
      <div class="field"><label for="pName">Full name</label><input id="pName" autocomplete="name" value="${esc(p.name)}" placeholder="e.g. Tiaan van der Merwe"></div>
      <div class="field"><label for="pPhone">Cell number (optional)</label><input id="pPhone" type="tel" autocomplete="tel" inputmode="tel" value="${esc(p.phone)}"></div>
      <div class="field"><span class="lab">Signature</span>
        <div class="sig"><canvas id="pad" aria-label="Signature pad – sign with your finger"></canvas><span class="ph" id="padPh">Sign here with your finger</span></div>
        <div class="row"><button type="button" class="btn secondary" id="sigUp">Upload picture</button><button type="button" class="btn secondary" id="sigClr">Clear</button></div>
        <input type="file" accept="image/*" id="sigFile" style="display:none"></div>
    </div>`;
  }
  function vProfile(first){
    const p = S.profile || {};
    return `<header><img class="logo" src="icons/logo.png" alt=""><div style="flex:1"><div class="sub">${first ? 'One more step' : 'Blue Cranes Online'}</div><h1>${first ? 'Set up profile' : 'My profile'}</h1></div></header>
      <main><form id="profForm" class="card" onsubmit="return false">${profileFields(p)}
        <div id="err" class="warn" role="alert"></div>
        <button class="btn primary" type="button" id="go">Save profile</button>
        ${first ? '' : '<button class="btn secondary" type="button" id="cancel">Cancel</button>'}
      </form>${first ? `<button class="link" id="signOut">Sign out</button>` : ''}</main>`;
  }
  function vHome(){
    const p = S.profile || {}; const h = new Date().getHours();
    const hi = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    const first = String(p.name || '').split(' ')[0];
    return `<header><img class="logo" src="icons/logo.png" alt="Blue Cranes"><div style="flex:1;min-width:0"><div class="sub">${new Date().toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long'})}</div><h1>${esc(hi)}${first ? ', ' + esc(first) : ''}</h1></div></header>
      <main>
        <div class="tiles">${TOOLS.map(t => `<a class="tile" href="${t.href}"><span class="ic">${t.icon}</span><b>${esc(t.name)}</b><span>${esc(t.text)}</span></a>`).join('')}</div>
        <section class="card" style="gap:10px">
          <div style="display:flex;justify-content:space-between;align-items:center"><h2>My profile</h2><button class="link" id="editProf" style="padding:6px">Edit</button></div>
          <div class="me">${p.signature ? `<img src="${esc(p.signature)}" alt="Your signature">` : ''}<div style="min-width:0"><div style="font-weight:700">${esc(p.name)}</div><div class="hint" style="word-break:break-all">${esc(S.user ? S.user.email : '')}${p.phone ? ' · ' + esc(p.phone) : ''}</div></div></div>
        </section>
        <div id="installBox"></div>
        ${S.cloud ? '<button class="btn secondary" id="signOut">Sign out</button>' : '<div class="status">Cloud saving is not set up – data stays on this phone.</div>'}
        <div class="status">Blue Cranes Online · version 13 Nov</div>
      </main>`;
  }

  // ---------- signature pad ----------
  function wirePad(){
    const c = document.getElementById('pad'); if (!c) return; const ctx = c.getContext('2d'); let drawing = false, last = null;
    const ph = () => document.getElementById('padPh').style.display = S.sig ? 'none' : 'block';
    const size = () => { const r = c.getBoundingClientRect(), k = window.devicePixelRatio || 1; c.width = r.width * k; c.height = r.height * k; ctx.setTransform(k,0,0,k,0,0); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#13224f';
      if (S.sig){ const im = new Image(); im.onload = () => { const s = Math.min(r.width/im.width, r.height/im.height, 1.6), w = im.width*s, h = im.height*s; ctx.drawImage(im, (r.width-w)/2, (r.height-h)/2, w, h); }; im.src = S.sig; } ph(); };
    const pos = e => { const r = c.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; };
    c.onpointerdown = e => { drawing = true; last = pos(e); c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last.x, last.y, 1.1, 0, 7); ctx.fillStyle = '#13224f'; ctx.fill(); };
    c.onpointermove = e => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; };
    c.onpointerup = c.onpointercancel = () => { if (!drawing) return; drawing = false; S.sig = trimCanvas(c); ph(); };
    document.getElementById('sigClr').onclick = () => { S.sig = null; size(); };
    const f = document.getElementById('sigFile');
    document.getElementById('sigUp').onclick = () => f.click();
    f.onchange = async () => { const file = f.files[0]; f.value = ''; if (!file) return; try { S.sig = await BC.fileToSig(file); size(); toast('Signature added'); } catch(e){ toast('Could not read that picture – try a JPG or screenshot'); } };
    size();
  }
  // cut the empty space around a drawn signature so it prints at a good size
  function trimCanvas(c){
    const x = c.getContext('2d'), w = c.width, h = c.height, d = x.getImageData(0, 0, w, h).data; let a = w, b = h, cc = -1, dd = -1;
    for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) if (d[(y*w+i)*4+3] > 20){ if (i < a) a = i; if (i > cc) cc = i; if (y < b) b = y; if (y > dd) dd = y; }
    if (cc < 0) return null; const pad = 10; a = Math.max(0, a-pad); b = Math.max(0, b-pad); cc = Math.min(w-1, cc+pad); dd = Math.min(h-1, dd+pad);
    const o = document.createElement('canvas'); o.width = cc-a+1; o.height = dd-b+1; o.getContext('2d').drawImage(c, a, b, o.width, o.height, 0, 0, o.width, o.height); return o.toDataURL('image/png');
  }
  function readProfile(err){
    const name = document.getElementById('pName').value.trim(), phone = document.getElementById('pPhone').value.trim();
    if (!name){ err.textContent = 'Enter your full name.'; return null; }
    if (!S.sig){ err.textContent = 'Add your signature – sign in the box or upload a picture.'; return null; }
    return { kind:'profile', name, phone, signature:S.sig, updated:new Date().toISOString() };
  }
  function authMsg(e){
    const c = (e && e.code) || '';
    if (/invalid-credential|wrong-password|user-not-found/.test(c)) return 'Email or password is wrong.';
    if (c.includes('email-already-in-use')) return 'There is already an account with this email. Sign in instead.';
    if (c.includes('weak-password')) return 'Password must be at least 6 characters.';
    if (c.includes('invalid-email')) return 'That email address doesn\'t look right.';
    if (c.includes('network')) return 'No signal. Signing in needs internet.';
    if (c.includes('too-many-requests')) return 'Too many tries. Wait a few minutes.';
    return 'Something went wrong' + (c ? ' (' + c + ')' : '') + '.';
  }

  // ---------- render & wire ----------
  function render(){
    app.innerHTML = S.view === 'auth' ? vAuth() : S.view === 'setup' ? vProfile(true) : S.view === 'profile' ? vProfile(false) : S.view === 'home' ? vHome() : big('Online') + '<main><div class="status">Loading…</div></main>';
    window.scrollTo(0, 0); wire();
  }
  function wire(){
    app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { const e = document.getElementById('aEmail'); if (e) S.email = e.value; S.mode = b.dataset.mode; if (S.mode === 'up') S.sig = null; render(); });
    if (document.getElementById('pad')) wirePad();
    const go = document.getElementById('go'), err = document.getElementById('err');
    const busy = async (fn) => { const old = go.textContent; go.disabled = true; go.textContent = 'Please wait…'; try { await fn(); } catch(e){ err.textContent = authMsg(e); } finally { if (document.body.contains(go)){ go.disabled = false; go.textContent = old; } } };
    if (document.getElementById('authForm')) go.onclick = () => {
      err.textContent = ''; const email = document.getElementById('aEmail').value.trim(); S.email = email; const pwEl = document.getElementById('aPw'); const pw = pwEl ? pwEl.value : '';
      if (!email){ err.textContent = 'Enter your email.'; return; }
      if (S.mode !== 'reset' && !pw){ err.textContent = 'Enter your password.'; return; }
      if (S.mode === 'reset') return busy(async () => { await Cloud.resetPassword(email); toast('Reset email sent – check your inbox'); S.mode = 'in'; render(); });
      if (S.mode === 'up'){ const prof = readProfile(err); if (!prof) return; S.pending = prof; return busy(async () => { try { await Cloud.signUp(email, pw); } catch(e){ S.pending = null; throw e; } }); }
      return busy(() => Cloud.signIn(email, pw));
    };
    if (document.getElementById('profForm')) go.onclick = () => busy(async () => {
      err.textContent = ''; const prof = readProfile(err); if (!prof) return;
      await saveProfile(prof); toast('Profile saved'); S.view = 'home'; render();
    });
    const cancel = document.getElementById('cancel'); if (cancel) cancel.onclick = () => { S.view = 'home'; render(); };
    const ep = document.getElementById('editProf'); if (ep) ep.onclick = () => { S.sig = (S.profile || {}).signature || null; S.view = 'profile'; render(); };
    const so = document.getElementById('signOut'); if (so) so.onclick = async () => { if (!confirm('Sign out of Blue Cranes Online on this phone?')) return; BC.cacheProfile(null); try { localStorage.removeItem('dts-v1'); } catch(e){} await Cloud.signOut(); };
    installBox();
  }
  async function saveProfile(prof){
    if (S.cloud) await Cloud.setItem('profile', prof);
    prof.uid = S.user ? S.user.uid : 'local'; S.profile = prof; BC.cacheProfile(prof);
  }

  // ---------- install ----------
  let installEvt = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; installBox(); });
  function installBox(){
    const box = document.getElementById('installBox'); if (!box) return;
    const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    if (standalone){ box.innerHTML = ''; return; }
    if (installEvt){ box.innerHTML = '<button class="btn primary" id="inst">Install Blue Cranes Online on this phone</button>'; document.getElementById('inst').onclick = async () => { const e = installEvt; installEvt = null; e.prompt(); try { await e.userChoice; } catch(_){} installBox(); }; return; }
    box.innerHTML = /iphone|ipad|ipod/i.test(navigator.userAgent)
      ? '<div class="card" style="gap:6px"><b>Install on iPhone</b><span class="hint">Open this page in Safari, tap Share, then <b>Add to Home Screen</b>.</span></div>'
      : '<div class="card" style="gap:6px"><b>Install on this phone</b><span class="hint">Open the browser menu (⋮) and tap <b>Install app</b> or <b>Add to Home screen</b>.</span></div>';
  }

  // ---------- start ----------
  (async function start(){
    if (!window.Cloud && document.readyState === 'loading') await new Promise(r => document.addEventListener('DOMContentLoaded', r, { once:true }));
    S.cloud = window.Cloud ? await Cloud.ready : false;
    if (!S.cloud){ S.profile = BC.cachedProfile(); S.view = S.profile ? 'home' : 'setup'; if (!S.profile) S.sig = null; render(); return; }
    const wantProfile = /[?&]profile=1/.test(location.search);
    Cloud.onAuth(async u => {
      S.user = u;
      if (!u){ S.profile = null; BC.cacheProfile(null); S.view = 'auth'; render(); return; }
      let p = null;
      if (S.pending){ const prof = S.pending; S.pending = null; await saveProfile(prof); p = S.profile; toast('Account created'); }
      else { try { p = await Cloud.getItem('profile'); } catch(e){} if (p){ p.uid = u.uid; BC.cacheProfile(p); } }
      S.profile = p;
      if (!p || !p.name || !p.signature){ S.sig = p && p.signature || null; S.view = 'setup'; render(); return; }
      S.view = wantProfile ? 'home' : 'home'; render();
    });
  })();
})();
</script>
</body>
</html>

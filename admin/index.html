<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin – Blue Cranes Online</title>
<meta name="theme-color" content="#0B3575">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../vendor/xlsx.full.min.js" defer></script>
<script src="../shared/firebase-config.js"></script>
<script type="module" src="../shared/cloud.js"></script>
<script src="../shared/app.js"></script>
<style>
  :root{--ink:#2B2C30;--ground:#EEF2F7;--card:#fff;--line:#D9E0EA;--field:#AEB8C7;--navy:#21457F;--navyDeep:#0B3575;--yellow:#FBD220;--yellowDark:#F5B826;--muted:#566070;--label:#343A44;--ok:#15703D;--bad:#A12A1F;--warn:#8A5A00}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
  .app{width:100%;min-height:100vh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:5;background:var(--navyDeep);color:#fff;border-bottom:4px solid var(--yellow);padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px}
  header a{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
  .sub{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#C9D5EA}
  h1,h2{font-family:Montserrat,sans-serif;font-weight:900;margin:0;text-transform:uppercase}
  h1{font-size:20px} h2{font-size:15px;color:var(--navyDeep)}
  nav.seg{display:flex;gap:6px;padding:12px 14px 0}
  nav.seg button{flex:1;height:44px;border-radius:10px;border:1.5px solid var(--navy);background:#fff;color:var(--navyDeep);font-weight:800;font-size:14px;font-family:inherit;cursor:pointer}
  nav.seg button[aria-current="page"]{background:var(--navyDeep);color:#fff}
  main{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
  .steps{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
  .hint{font-size:12.5px;color:var(--muted);line-height:1.45} .warn{font-size:13px;color:var(--bad);font-weight:600}
  .btn{height:48px;border-radius:12px;border:0;font-weight:700;font-size:15px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%;padding:0 12px;text-decoration:none}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .primary{background:var(--yellow);color:var(--navyDeep);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
  .secondary{background:#fff;color:var(--navyDeep);border:2px solid var(--navy)}
  .navy{background:var(--navyDeep);color:#fff}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:140px}
  .field label{font-size:12.5px;font-weight:600;color:var(--label)}
  .field input,.field select{height:46px;border-radius:10px;border:1.5px solid var(--field);background:#fff;padding:0 10px;font-size:16px;font-family:inherit;color:var(--ink);width:100%}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:6px 4px;border-bottom:1.5px solid var(--line);white-space:nowrap}
  td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
  .pill.ok{background:#E3F1E8;color:var(--ok)} .pill.bad{background:#F8E1DE;color:var(--bad)} .pill.warn{background:#FBEFD5;color:#7A4F00} .pill.plan{background:#E3EAF5;color:var(--navyDeep)} .pill.busy{background:var(--yellow);color:var(--navyDeep)}
  tr.err td{background:#FDF3F2}
  .drop{border:2px dashed var(--field);border-radius:14px;padding:18px;text-align:center;background:#FAFBFD;cursor:pointer}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navyDeep);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:30;max-width:90%}
  .x{border:1.5px solid var(--bad);color:var(--bad);background:#fff;border-radius:8px;height:34px;padding:0 10px;font-weight:700;font-family:inherit;cursor:pointer}
  /* computer screens: use the whole window; small cards sit side by side, cards with a table take the full width */
  @media (min-width:900px){
    header,nav.seg{padding-left:clamp(14px,2.5vw,40px);padding-right:clamp(14px,2.5vw,40px)}
    main{padding:16px clamp(14px,2.5vw,40px) 40px;gap:16px}
    .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:stretch}
    nav.seg{max-width:900px}
    .btn{max-width:520px}
    table{font-size:14px} td,th{padding:8px 8px}
  }
  @media (min-width:1600px){ table{font-size:15px} .hint{font-size:13.5px} }
</style>
</head>
<body>
<div class="app" id="app"><main><div class="empty">Loading…</div></main></div>
<script>
(function(){
  'use strict';
  const app = document.getElementById('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = () => keyOf(new Date());
  const niceDate = k => { if (!/^\d{4}-\d{2}-\d{2}$/.test(k || '')) return k || ''; const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d).toLocaleDateString('en-ZA', { weekday:'short', day:'numeric', month:'short', year:'numeric' }); };
  const hm = h => { const t = Math.round((Number(h) || 0) * 60), H = Math.floor(t / 60), M = t % 60; return H + ':' + pad(M); };
  const clockH = (a, b) => { const m = s => { const r = /^(\d{1,2})[:h.]?(\d{2})$/.exec(String(s || '').trim()); return r ? Number(r[1]) * 60 + Number(r[2]) : NaN; }; const x = m(a), y = m(b); if (isNaN(x) || isNaN(y)) return NaN; let d = y - x; if (d < 0) d += 1440; return d / 60; };
  let tt; function toast(m){ let t = document.querySelector('.toast'); if (!t){ t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent = m; clearTimeout(tt); tt = setTimeout(() => t.remove(), 3000); }
  const S = { tab:'load', users:[], jobs:[], preview:null, fileName:'', busy:false, techFilter:'', inv:null, invFile:'', invJob:'', invSite:'', invCust:'', invSkip:[], nj:{}, invProg:{} };
  const nameOf = email => { const u = S.users.find(x => x.email === email); return u ? (u.name || email) : ''; };

  // ---------- Excel helpers ----------
  async function xlsxReady(){ for (let i = 0; i < 60 && !window.XLSX; i++) await new Promise(r => setTimeout(r, 100)); if (!window.XLSX) throw new Error('Excel tool not loaded'); }
  function download(wb, name){ XLSX.writeFile(wb, name, { compression:true }); }
  function sheet(rows, widths){ const ws = XLSX.utils.json_to_sheet(rows); if (widths) ws['!cols'] = widths.map(w => ({ wch:w })); return ws; }
  const COLS = ['Date', 'Time', 'Job card', 'Customer', 'Contact', 'Notes', 'Technician email'];
  const ALIAS = { 'date':'date', 'day':'date', 'time':'time', 'start time':'time', 'job card':'card', 'job card no':'card', 'job card nr':'card', 'job nr':'card', 'job no':'card', 'job number':'card', 'job':'card', 'customer':'customer', 'client':'customer', 'contact':'contact', 'contact person':'contact', 'notes':'notes', 'note':'notes', 'description':'notes', 'technician email':'tech', 'tech email':'tech', 'email':'tech', 'technician':'tech', 'tech':'tech' };
  function toDate(v){
    if (v == null || v === '') return '';
    if (v instanceof Date && !isNaN(v)) return keyOf(v);
    if (typeof v === 'number'){ const d = XLSX.SSF.parse_date_code(v); return d ? d.y + '-' + pad(d.m) + '-' + pad(d.d) : ''; }
    const t = String(v).trim(); let m;
    if ((m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/.exec(t))) return m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);
    if ((m = /^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/.exec(t))) return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + pad(m[2]) + '-' + pad(m[1]);   // day/month/year (South Africa)
    const d = new Date(t); return isNaN(d) ? '' : keyOf(d);
  }
  function toTime(v){
    if (v == null || v === '') return '';
    if (v instanceof Date && !isNaN(v)) return pad(v.getHours()) + ':' + pad(v.getMinutes());
    if (typeof v === 'number'){ const mins = Math.round((v % 1) * 1440); return pad(Math.floor(mins / 60)) + ':' + pad(mins % 60); }
    const m = /^(\d{1,2})[:h.](\d{2})/.exec(String(v).trim()); return m ? pad(m[1]) + ':' + m[2] : '';
  }
  // same job (date + job card/customer + tech) always gets the same id, so loading a file twice updates instead of doubling
  function jobId(j){ const s = [j.date, String(j.card || j.customer).trim().toUpperCase(), j.tech].join('|'); let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return 'J' + j.date.replace(/-/g, '') + '-' + h.toString(36); }

  async function readFile(file){
    await xlsxReady();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:false });   // dates as Excel numbers: no time-zone shift
    const ws = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(ws, { defval:'', raw:true });
    const known = new Set(S.users.map(u => u.email));
    const existing = new Map(S.jobs.map(j => [j.id, j]));
    return raw.map((r, n) => {
      const j = {}; Object.keys(r).forEach(k => { const f = ALIAS[String(k).trim().toLowerCase().replace(/[.:#]/g, '').replace(/\s+/g, ' ')]; if (f && j[f] == null) j[f] = r[k]; });
      const out = { line:n + 2, date:toDate(j.date), time:toTime(j.time), card:String(j.card || '').trim(), customer:String(j.customer || '').trim(), contact:String(j.contact || '').trim(), notes:String(j.notes || '').trim(), tech:String(j.tech || '').trim().toLowerCase() };
      const errs = [], warns = [];
      if (!out.date) errs.push('date missing or not understood');
      if (!out.card && !out.customer) errs.push('job card or customer needed');
      if (!out.tech) errs.push('technician email missing'); else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(out.tech)) errs.push('technician email not valid');
      else if (!known.has(out.tech)) warns.push('this tech has not signed in yet – they will see it once they do');
      if (!errs.length){ out.id = jobId(out); if (existing.has(out.id)) warns.push('already loaded – will be updated'); }
      out.errs = errs; out.warns = warns;
      return out;
    }).filter(r => r.date || r.card || r.customer || r.tech);
  }

  // ---------- client's inventory from Excel ----------
  const ICOLS = ['Customer', 'Site', 'Location', 'Serial nr', 'Description', 'Manufacturer', 'SWL (kg)', 'Job nr'];
  const IALIAS = { 'customer':'customer', 'client':'customer', 'site':'site', 'location':'loc', 'area':'loc', 'item location':'loc', 'serial nr':'serial', 'serial no':'serial', 'serial number':'serial', 'serial':'serial', 'item no':'serial', 'item nr':'serial', 'item number':'serial', 'id no':'serial', 'id nr':'serial', 'description':'desc', 'item':'desc', 'equipment':'desc',
    'manufacturer':'make', 'make':'make', 'swl kg':'swl', 'swl':'swl', 'tonnage':'swl', 'capacity':'swl', 'wll':'swl', 'safe working load':'swl', 'safe working load kg':'swl', 'job nr':'job', 'job no':'job', 'job number':'job', 'job card':'job', 'job':'job' };
  const up = s => String(s == null ? '' : s).trim().toUpperCase().replace(/\s+/g, ' ');
  const cardCore = s => up(s).replace(/^C(?=\d)/, '');
  // a plain number under a heading in tons ("SWL (t)", "TONNAGE") is tons, up to 100
  const swlIn = (v, unit) => { const n = typeof v === 'number' ? v : /^\s*\d+([.,]\d+)?\s*$/.test(String(v == null ? '' : v)) ? Number(String(v).trim().replace(',', '.')) : NaN;
    if (!isNaN(n) && unit === 't' && n <= 100) return String(Math.round(n * 1000)); return swlText(v); };
  const swlText = v => { if (v == null || v === '') return ''; if (typeof v === 'number') return String(Math.round(v * 1000) / 1000); const tn = /^(?:swl\s*)?(\d+(?:[.,]\d+)?)\s*(?:t|ton|tons|tonne|tonnes)\.?(?:\s*swl)?$/i.exec(String(v).trim()); if (tn) return String(Math.round(Number(tn[1].replace(',', '.')) * 1000)); const t = String(v).trim().replace(/\s*kgs?\.?$/i, ''); return /^[\d\s.,]+$/.test(t) ? t.replace(/\s/g, '').replace(/,(?=\d{3}\b)/g, '').replace(',', '.') : t; };
  const invJobs = () => { const from = keyOf(new Date(Date.now() - 864e5)); return S.jobs.filter(j => j.status !== 'done' && j.date >= from).sort((a, b) => (a.date + (a.time || '99') + a.customer).localeCompare(b.date + (b.time || '99') + b.customer)); };
  // Reads our template, an export, or a customer's own "census" sheet: the heading row may be lower down (title lines above it),
  // tonnage like "1,5 TON" / "250KG" becomes kg, and a line with only a description is a note on the item above it.
  // headings differ from client to client: exact names first, then by what the heading contains
  const hkey = k => { const h = String(k == null ? '' : k).trim().toLowerCase().replace(/\./g, '').replace(/[:#()\/\\_-]/g, ' ').replace(/\s+/g, ' ').trim(); if (!h || h.length > 40) return undefined;
    if (IALIAS[h]) return IALIAS[h];
    if (/locat|area|department|dept|section|position|placement|where/.test(h)) return 'loc';
    if (/swl|wll|safe working|working load|tonnage|capacity|rated load|max load|load limit|\bton|\bkg\b/.test(h)) return 'swl';
    if (/serial|item ?n(o|r|um)|id ?n(o|r)|asset|tag ?n(o|r)|equip(ment)? ?n(o|r)|^ref/.test(h)) return 'serial';
    if (/^(no|nr|number)$/.test(h)) return 'serial?';   // a plain "No." column: only if nothing better
    if (/descr|equipment|^item$|^type$|item type|^name$/.test(h)) return 'desc';
    if (/manuf|^make$|brand/.test(h)) return 'make';
    if (/customer|client|company/.test(h)) return 'customer';
    if (/^site/.test(h)) return 'site';
    return undefined; };
  async function readInv(file){
    await xlsxReady();
    const wb = XLSX.read(await file.arrayBuffer(), { type:'array', cellDates:false });
    const grid = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, defval:'', raw:true, blankrows:true });
    const t = v => String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
    let hr = -1, best = 1; for (let i = 0; i < Math.min(grid.length, 25); i++){ const n = new Set((grid[i] || []).map(hkey).filter(Boolean)).size; if (n > best){ best = n; hr = i; } }
    if (hr < 0) return { rows:[], site:'', customer:'', skipped:[], noHead:true };
    const col = {}; (grid[hr] || []).forEach((h, c) => { const f = hkey(h); if (f && col[f] == null) col[f] = c; });
    if (col.serial == null && col['serial?'] != null) col.serial = col['serial?'];
    const swlHead = col.swl == null ? '' : String(grid[hr][col.swl]).toLowerCase();
    const swlUnit = /\bkg\b|kilo/.test(swlHead) ? 'kg' : /\(\s*t\s*\)|\bt\b|ton/.test(swlHead) ? 't' : '';
    let title = ''; for (let i = 0; i < hr && !title; i++) title = t((grid[i] || []).find(v => t(v)));
    const seen = {}, rows = [], skipped = []; let site = '', cust = '';
    for (let i = hr + 1; i < grid.length; i++){
      const g = grid[i] || []; const filled = g.map((v, c) => t(v) ? c : -1).filter(c => c >= 0); if (!filled.length) continue;
      const get = f => col[f] == null ? '' : g[col[f]];
      if (filled.length === 1 && col.desc != null && filled[0] !== col.serial){ const last = rows[rows.length - 1];   // a remark under an item
        if (filled[0] === col.desc && last){ last.note = (last.note ? last.note + '; ' : '') + t(g[col.desc]); continue; } }
      if (filled.length === 1 && filled[0] === col.serial && col.desc != null && /[=:]|\s\S+\s/.test(t(g[col.serial]))){ skipped.push(t(g[col.serial])); continue; }   // a footer line such as "RED = UNSAFE FOR USE"
      const out = { line:i + 1, customer:t(get('customer')), loc:t(get('loc')), serial:t(get('serial')), desc:t(get('desc')), make:t(get('make')), swl:swlIn(get('swl'), swlUnit), job:t(get('job')), note:'', errs:[], warns:[] };
      if (!site && t(get('site'))) site = t(get('site')); if (!cust && out.customer) cust = out.customer;
      if (!(out.customer || out.loc || out.serial || out.desc || out.make || out.swl)) continue;
      if (!out.serial && !out.desc) out.errs.push('serial nr or description needed');
      const k = up(out.serial); if (k){ if (seen[k]) out.errs.push('serial nr is in the file twice (row ' + seen[k] + ')'); else seen[k] = out.line; }
      if (!out.serial && out.desc) out.warns.push('no serial nr');
      rows.push(out);
    }
    if (/^customer name$/i.test(title)) title = '';
    return { rows, site, customer:cust || (col.customer == null ? title : ''), skipped };
  }
  // a job made here, from the inventory tab, for one technician
  function newJob(){ const n = S.nj; const tech = String(n.tech || '').trim().toLowerCase(); const customer = String(n.customer || S.invCust || '').trim();
    const j = { date:n.date || keyOf(new Date(Date.now() + 864e5)), time:String(n.time || '').trim(), card:String(n.card || '').trim(), customer, contact:String(n.contact || '').trim(), notes:String(n.notes || '').trim(), tech };
    j.ready = !!(j.date && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(tech) && customer); j.id = jobId(j); return j; }
  function newJobForm(){ const j = newJob();
    return `<div class="row"><div class="field"><label for="njDate">Date</label><input type="date" id="njDate" data-nj="date" value="${esc(j.date)}"></div>
        <div class="field"><label for="njTime">Time</label><input type="time" id="njTime" data-nj="time" value="${esc(j.time)}"></div></div>
      <div class="field"><label for="njTech">Technician</label><select id="njTech" data-nj="tech"><option value="">Choose the technician…</option>${S.users.map(u => `<option value="${esc(u.email)}" ${u.email === j.tech ? 'selected' : ''}>${esc(u.name || u.email)} – ${esc(u.email)}</option>`).join('')}</select></div>
      <div class="field"><label for="njCust">Customer</label><input id="njCust" data-nj="customer" value="${esc(j.customer)}" placeholder="Filled in from the file"></div>
      <div class="row"><div class="field"><label for="njCard">Job card</label><input id="njCard" data-nj="card" value="${esc(j.card)}"></div>
        <div class="field"><label for="njCon">Contact</label><input id="njCon" data-nj="contact" value="${esc(j.contact)}"></div></div>
      <div class="field"><label for="njNotes">Notes</label><input id="njNotes" data-nj="notes" value="${esc(j.notes)}"></div>
      <span class="hint">Technicians show here once they have signed in to the app.</span>`; }
  function vInv(){
    const jobs = invJobs(); const job = S.invJob === '__new' ? newJob() : jobs.find(j => j.id === S.invJob); const p = S.inv; const ok = p ? p.filter(r => !r.errs.length) : [];
    const other = job && p ? [...new Set(p.map(r => r.customer).concat(S.invCust).filter(c => c && up(c) !== up(job.customer)))] : [];
    return `<main><div class="steps">
      <section class="card"><h2>1. Get the Excel template</h2>
        <span class="hint">Your census layout: customer name on the first line, then <b>ITEM NO · DESCRIPTION · TONNAGE · ITEM LOCATION</b>, one row per item. Tonnage like <b>1,5 TON</b> or <b>250KG</b> is changed to kg. ${job ? 'The template is made out for <b>' + esc(job.customer || job.card) + '</b>.' : 'Choose the job first (step 2) to have the customer filled in.'}</span>
        <button class="btn secondary" id="itpl">⬇ Download census template (.xlsx)</button>
        <span class="hint">Our own columns (${ICOLS.join(' · ')}) and a sheet from <b>Export → Client inventories</b> also load.</span></section>
      <section class="card"><h2>2. Choose the job</h2>
        ${jobs.length || true ? `<div class="field"><label for="ij">Load the items for this job</label><select id="ij"><option value="">Choose a job…</option><option value="__new" ${S.invJob === '__new' ? 'selected' : ''}>＋ New job – schedule it for a technician</option>${jobs.map(j => `<option value="${esc(j.id)}" ${j.id === S.invJob ? 'selected' : ''}>${esc(niceDate(j.date))} · ${esc(j.customer || '–')}${j.card ? ' · ' + esc(j.card) : ''} · ${esc(nameOf(j.tech) || j.tech)}${(j.inv || []).length ? ' (' + j.inv.length + ' items loaded)' : ''}</option>`).join('')}</select></div>
          ${S.invJob === '__new' ? newJobForm() : `<span class="hint">Pick a job loaded with <b>Load jobs</b>, or <b>＋ New job</b> to schedule one for a technician here. The technician sees the job on their schedule, starts it, marks each item Safe or Unsafe in <b>Client's inventory</b>, and taps <b>Finish job</b> to submit it.</span>`}
          ${job && (job.inv || []).length ? `<span class="hint" style="color:var(--warn)">This job already has ${job.inv.length} items loaded. Loading a new file replaces that list (items the technician already has on the phone stay).</span>` : ''}`
          : '<div class="empty">No open jobs. Load the job first with <b>Load jobs</b>.</div>'}</section>
      <section class="card"><h2>3. Load your file</h2>

        sheets.push({ Date:s.date, Technician:tech, Email:u.email, Assistant:s.assistant || '', Vehicle:s.reg || '', 'First odometer':Number(s.firstOdo) || '', 'Last odometer':s.lastOdo ? Number(s.lastOdo) : '', Km:km,
          'Clock in':s.clockIn || '', 'Clock out':s.clockOut || '', 'Clock time (h:mm)':isNaN(ch) ? '' : hm(ch), 'Job time (h:mm)':hm(jh), Jobs:(s.jobs || []).length, Submitted:s.status === 'submitted' ? 'Yes' : 'No',
          'Vehicle check':['Tyres','Windows','Water','Oil','Body'].map(k => k + ' ' + (c[k] || '–')).join(', '), 'Check notes':s.condNote || '' }); });
      if (!jobs.length && !sheets.length){ toast('No time sheets in that period'); return; }
      const by = (a, b) => (a.Date + a.Technician).localeCompare(b.Date + b.Technician); jobs.sort(by); sheets.sort(by);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, sheet(jobs, [11, 22, 28, 14, 12, 8, 12, 26, 16, 10, 7, 10, 7, 30]), 'Jobs');
      XLSX.utils.book_append_sheet(wb, sheet(sheets, [11, 22, 28, 14, 12, 10, 10, 7, 8, 8, 10, 10, 6, 9, 46, 30]), 'Time sheets');
      download(wb, `Blue Cranes jobs and time sheets ${from} to ${to}.xlsx`); toast(jobs.length + ' jobs, ' + sheets.length + ' time sheets exported');
    } catch(e){ console.error(e); toast('Export failed – check the Firebase rules'); }
    finally { btn.disabled = false; btn.innerHTML = old; }
  }
  // ---------- census layout (the way Blue Cranes sends inventories) ----------
  let exReady = null;
  function excelJS(){ return exReady = exReady || new Promise((res, rej) => { if (window.ExcelJS) return res(window.ExcelJS); const sc = document.createElement('script'); sc.src = '../vendor/exceljs.min.js'; sc.onload = () => res(window.ExcelJS); sc.onerror = () => { exReady = null; rej(new Error('Excel tool not loaded')); }; document.head.appendChild(sc); }); }
  const tonText = swl => { const t = String(swl == null ? '' : swl).trim(); if (!/^\d+(\.\d+)?$/.test(t)) return t.toUpperCase(); const kg = Number(t);
    return kg >= 1000 ? String(Math.round(kg / 10) / 100).replace('.', ',') + ' TON' : String(Math.round(kg * 100) / 100).replace('.', ',') + 'KG'; };
  const monthText = k => { const m = /^(\d{4})-(\d{2})/.exec(k || ''); return m ? new Date(Number(m[1]), Number(m[2]) - 1, 1).toLocaleDateString('en-ZA', { month:'long', year:'numeric' }).toUpperCase() : ''; };
  // customers: [{ name, month, items:[{ serial, desc, swl, loc, unsafe, reason }] }] → one sheet each
  async function censusBook(customers){
    const EX = await excelJS(); const wb = new EX.Workbook(); wb.creator = 'Blue Cranes Online'; const used = {};
    const red = { argb:'FFFF0000' }, line = { style:'thin', color:{ argb:'FF000000' } }, box = { top:line, left:line, bottom:line, right:line };
    customers.forEach(c => {
      let nm = (String(c.name || 'NO CUSTOMER').toUpperCase().replace(/[\[\]:*?\/\\]/g, ' ').replace(/\s+/g, ' ').trim() || 'SHEET').slice(0, 28); let n = nm, i = 2; while (used[n]) n = nm.slice(0, 26) + ' ' + i++; used[n] = 1;
      const ws = wb.addWorksheet(n, { pageSetup:{ paperSize:9, orientation:'portrait', fitToPage:true, fitToWidth:1, fitToHeight:0 } });
      ws.columns = [{ width:24 }, { width:54 }, { width:12 }, { width:26 }];
      [String(c.name || '').toUpperCase(), 'CENSUS OF LIFTING EQUIPMENT', c.month || ''].forEach((t, k) => { ws.mergeCells(k + 1, 1, k + 1, 4); const cl = ws.getCell(k + 1, 1); cl.value = t; cl.font = { name:'Arial', bold:true, size:12 }; cl.alignment = { horizontal:'center' }; });
      ['ITEM NO:', 'DESCRIPTION:', 'TONNAGE:', 'ITEM LOCATION:'].forEach((h, k) => { const cl = ws.getCell(4, k + 1); cl.value = h; cl.font = { name:'Arial', bold:true }; cl.border = box; });
      const order = []; c.items.forEach(it => { const l = it.loc || ''; if (!order.includes(l)) order.push(l); });
      let r = 6;
      order.forEach((l, gi) => { if (gi) r++;
        c.items.filter(it => (it.loc || '') === l).forEach(it => {
          [it.serial, it.desc, it.swl, it.loc].forEach((v, k) => { const cl = ws.getCell(r, k + 1); cl.value = String(v || '').toUpperCase(); cl.font = it.unsafe ? { name:'Arial', color:red } : { name:'Arial' }; cl.border = box; });
          r++;
          if (it.unsafe && it.reason){ const cl = ws.getCell(r, 2); cl.value = String(it.reason).toUpperCase(); cl.font = { name:'Arial', color:red }; cl.alignment = { wrapText:true }; r++; }
        }); });
      r++; const f = ws.getCell(r, 1); f.value = 'RED = UNSAFE FOR USE'; f.font = { name:'Arial', bold:true, color:red };
    });
    return wb;
  }
  async function saveBook(wb, name){ const buf = await wb.xlsx.writeBuffer(); const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    if (window.BC && BC.saveFile) return BC.saveFile(blob, name); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }
  async function censusFromUpload(btn){
    const job = S.jobs.find(j => j.id === S.invJob); const ok = (S.inv || []).filter(r => !r.errs.length); if (!ok.length) return;
    const name = (job && job.customer) || S.invCust || (ok.find(r => r.customer) || {}).customer || 'Customer';
    const old = btn.innerHTML; btn.disabled = true; btn.textContent = 'Making…';
    try { await saveBook(await censusBook([{ name, month:monthText(today()), items:ok.map(r => ({ serial:r.serial, desc:r.desc + (r.make && !/^unknown$/i.test(r.make) && !up(r.desc).includes(up(r.make)) ? ' (' + r.make + ')' : ''), swl:tonText(r.swl), loc:r.loc, unsafe:false, reason:'' })) }]), name + ' census.xlsx'); }
    catch(e){ console.error(e); toast('Could not make the file'); }
    finally { btn.disabled = false; btn.innerHTML = old; }
  }
  async function exportCensus(btn){
    const old = btn.innerHTML; btn.disabled = true; btn.textContent = 'Collecting…';
    try { await refreshUsers(); const by = new Map(); const lists = [];
      await eachUser('equipment', (u, l) => lists.push(l));
      lists.sort((a, b) => String(a.date + a.savedAt).localeCompare(String(b.date + b.savedAt)));
      lists.forEach(l => { const cust = String(l.customer || '').trim(); const ck = up(cust) || '(NO CUSTOMER)';
        const c = by.get(ck) || { name:cust || 'No customer', last:'', items:new Map() }; by.set(ck, c); c.name = cust || c.name;
        (l.rows || []).forEach((r, i) => { if (!r.serial && !r.desc) return; if (l.date > c.last) c.last = l.date;
          const make = String(r.make || '').trim(); let desc = String(r.desc || '').trim();
          if (make && !/^unknown$/i.test(make) && !up(desc).includes(up(make))) desc += ' (' + make + ')';
          const k = up(r.serial) || ('#' + l.id + '#' + i);
          c.items.set(k, { serial:r.serial || '', desc, swl:tonText(r.swl), loc:r.loc || l.location || '', unsafe:r.status === 'UNSAFE', reason:r.status === 'UNSAFE' ? (r.reason || '') : '' }); }); });
      const customers = [...by.values()].filter(c => c.items.size).sort((a, b) => a.name.localeCompare(b.name)).map(c => ({ name:c.name, month:monthText(c.last), items:[...c.items.values()] }));
      if (!customers.length){ toast('No client inventories yet'); return; }
      await saveBook(await censusBook(customers), `Blue Cranes client inventories ${today()}.xlsx`);
      toast(customers.length + (customers.length === 1 ? ' customer' : ' customers') + ' exported');
    } catch(e){ console.error(e); toast('Export failed – check the Firebase rules'); }
    finally { btn.disabled = false; btn.innerHTML = old; }
  }
  async function exportInv(btn){
    const old = btn.innerHTML; btn.disabled = true; btn.textContent = 'Collecting…';
    try { await xlsxReady(); await refreshUsers(); const reg = new Map();
      const lists = []; await eachUser('equipment', (u, l) => lists.push({ u, l }));
      lists.sort((a, b) => String(a.l.date + a.l.savedAt).localeCompare(String(b.l.date + b.l.savedAt)));
      lists.forEach(({ u, l }) => (l.rows || []).forEach(r => { if (!r.serial && !r.desc) return;
        const cust = String(l.customer || '').trim(); const key = cust.toUpperCase() + '|' + (String(r.serial || '').trim().toUpperCase() || ('#' + l.id + r.desc));
        const rep = r.report && r.report.no ? r.report.no + (r.report.cert ? ' / ' + r.report.cert : '') : '';
        reg.set(key, { Customer:cust, Site:l.location || '', Location:r.loc || '', 'Serial nr':r.serial || '', Description:r.desc || '', Manufacturer:r.make || '', 'SWL (kg)':/^\d+(\.\d+)?$/.test(String(r.swl || '').trim()) ? Number(r.swl) : (r.swl || ''),
          Condition:r.status === 'SAFE' ? 'Safe' : r.status === 'UNSAFE' ? 'Unsafe' : '', 'Unsafe reason':r.status === 'UNSAFE' ? (r.reason || '') : '', 'Report nr':rep, 'Job nr':l.job || '', 'Last listed':l.date || '', Technician:l.tech || u.name || u.email }); }));
      const rows = [...reg.values()].sort((a, b) => (a.Customer + a.Location + a.Description + a['Serial nr']).localeCompare(b.Customer + b.Location + b.Description + b['Serial nr']));
      if (!rows.length){ toast('No client inventories yet'); return; }
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, sheet(rows, [24, 18, 16, 14, 30, 16, 9, 9, 34, 20, 12, 11, 22]), 'Inventory');
      download(wb, `Blue Cranes client inventories ${today()}.xlsx`); toast(rows.length + ' items exported');
    } catch(e){ console.error(e); toast('Export failed – check the Firebase rules'); }
    finally { btn.disabled = false; btn.innerHTML = old; }
  }
  const $v = id => { const e = document.getElementById(id); return e ? e.value : ''; };
  async function refreshUsers(){ try { S.users = (await window.Cloud.listUsers()).filter(u => u.email).sort((a, b) => String(a.name || a.email).localeCompare(String(b.name || b.email))); } catch(e){ S.users = []; } }

  (async function start(){
    const w = await BC.requireUser();
    if (!w.user){ S.noAdmin = 'Cloud saving must be set up to use the admin page.'; render(); return; }
    if (!(await window.Cloud.isAdmin())){ S.noAdmin = `This page is for the office. Your account (${esc(window.Cloud.email())}) is not an admin.<br><br>To make an account an admin: in Firebase → Firestore → start a collection called <b>admins</b> and add a document whose ID is the email address (lower case).`; render(); return; }
    await refreshUsers(); await refreshJobs(); render();
  })();
})();
</script>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Time Sheet</title>
<meta name="theme-color" content="#0B3575">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2C30; --ground:#EEF2F7; --card:#FFFFFF; --line:#D9E0EA; --field:#AEB8C7; --navy:#21457F; --navyDeep:#0B3575; --yellow:#FBD220; --yellowDark:#F5B826;
    --muted:#566070; --label:#343A44; --accent:#21457F; --accentDark:#0B3575;
    --A:#15703D; --W:#8A5A00; --X:#A12A1F;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--ground)}
  header{background:var(--navyDeep);color:#fff;border-bottom:4px solid var(--yellow);padding:16px 16px 14px;display:flex;align-items:center;gap:8px}
  header{padding-top:calc(16px + env(safe-area-inset-top)) !important}
  nav.tabs{padding-bottom:env(safe-area-inset-bottom);height:calc(64px + env(safe-area-inset-bottom)) !important}
  body{min-height:100vh}
  header .sub{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#C9D5EA}
  .logo{width:52px;height:52px;border-radius:50%;background:#fff;flex-shrink:0;display:block}
  h1,h2{font-family:Montserrat,sans-serif;font-weight:900;margin:0;letter-spacing:0;text-transform:uppercase}
  h2{color:var(--navyDeep)}
  h1{font-size:22px;line-height:1.15} h2{font-size:17px}
  .back{width:44px;height:44px;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer}
  .back:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--yellowDark);outline-offset:2px}
  main{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;padding-bottom:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .v{font-size:15px;font-weight:600;word-break:break-word}
  .big{font-family:Montserrat,sans-serif;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .stat{background:#DCE5F2;border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
  .stat .k{color:#3A4658}
  .dark{background:var(--navyDeep);color:#fff;border-radius:12px;padding:14px 16px}
  .dark .k{color:#C9D5EA}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label,.lab{font-size:13px;font-weight:600;color:var(--label)}
  .field select{height:52px;border-radius:10px;border:1.5px solid var(--field);background:#fff;padding:0 12px;font-size:17px;font-family:inherit;color:var(--ink);width:100%;font-weight:600}
  .field input,.field textarea{height:52px;border-radius:10px;border:1.5px solid var(--field);background:#fff;padding:0 14px;font-size:17px;font-family:inherit;color:var(--ink);width:100%}
  .field textarea{height:auto;padding:12px 14px;font-size:15px;resize:vertical}
  .field input.num{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .hint{font-size:12px;color:var(--muted)}
  .warn{font-size:13px;color:var(--X);font-weight:600}
  .btn{height:52px;border-radius:12px;border:0;font-weight:700;font-size:16px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%;padding:0 14px}
  .primary{background:var(--yellow);color:var(--navyDeep);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
  .primary:hover{background:var(--yellowDark)}
  .primary:disabled{background:#E8DCA0;cursor:not-allowed}
  .secondary{background:#fff;color:var(--navyDeep);border:2px solid var(--navy)}
  .ghost{background:transparent;color:var(--X);border:1.5px solid var(--X)}
  .row{display:flex;gap:10px}
  .job{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer;font-size:inherit}
  .job:hover{border-color:var(--field)}
  .num-badge{width:32px;height:32px;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
  .stepper{display:flex;align-items:center;gap:12px}
  .stepper button{width:56px;height:56px;border-radius:12px;border:2px solid var(--navy);background:#fff;font-size:26px;font-weight:700;font-family:inherit;color:var(--ink);cursor:pointer}
  .stepper .val{flex:1;height:56px;border-radius:12px;background:#fff;border:1.5px solid var(--field);display:flex;align-items:center;justify-content:center;font-family:Montserrat,sans-serif;font-size:26px;font-weight:800}
  .cond{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0}
  .seg{display:flex;gap:6px}
  .seg button{width:48px;height:44px;border-radius:10px;font-family:inherit;font-size:17px;font-weight:700;background:#fff;color:var(--muted);border:1.5px solid var(--field);cursor:pointer}
  .seg button[aria-pressed="true"].A{background:var(--A);border-color:var(--A);color:#fff}
  .seg button[aria-pressed="true"].W{background:var(--W);border-color:var(--W);color:#fff}
  .seg button[aria-pressed="true"].X{background:var(--X);border-color:var(--X);color:#fff}
  nav.tabs{position:sticky;bottom:0;height:64px;background:#fff;border-top:1px solid var(--line);display:flex}
  nav.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
  nav.tabs button[aria-current="page"]{color:var(--navyDeep);font-weight:800;box-shadow:inset 0 4px 0 var(--yellow)}
  .pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .pill.ok{background:#E3F1E8;color:#15703D}
  .pill.warn{background:#FBEFD5;color:#7A4F00}
  .pill.bad{background:#F8E1DE;color:#A12A1F}
  .pill.prog{background:var(--yellow);color:var(--navyDeep)}
  .status{font-size:12px;color:var(--muted);text-align:center;padding:4px}
  .empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:15px}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--navyDeep);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:10;max-width:90%}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .modal{background:#fff;border-radius:16px 16px 0 0;padding:20px 16px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px}
  pre.summary{white-space:pre-wrap;font-size:13px;background:#F7F7F4;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:50vh;overflow:auto;margin:0}
</style>
</head>

  // ---------- storage ----------
  let db = null, uid = null, store = 'local';
  const LS_KEY = 'dts-v1';
  const state = { sheets: {}, schedule: {}, settings: { tech:'', assistant:'', reg:'' }, view: 'today', jobIdx: null, detailKey: null, schedWeek: null, schedId: null, schedDate: null, prefill: null, loaded: false, storeNote: '' };

  function lsRead(){ try { const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
  function lsWrite(){ try { localStorage.setItem(LS_KEY, JSON.stringify({ sheets: state.sheets, schedule: state.schedule, settings: state.settings })); } catch(e){} }

  const queues = {};
  function enqueue(key, fn){
    const prev = queues[key] || Promise.resolve();
    const next = prev.then(fn, fn);
    queues[key] = next.catch(()=>{});
    return next;
  }
  function saveSheet(key){
    lsWrite();
    if (!db || !uid) return;
    const data = JSON.parse(JSON.stringify(state.sheets[key]));
    enqueue(key, () => db.collection('data/users/' + uid).doc('sheet-' + key).set({ kind:'sheet', ...data }))
      .catch(e => { toast('Saved on this phone – cloud save failed' + (e && e.code ? ' (' + e.code + ')' : '')); });
  }
  function deleteSheetRemote(key){
    lsWrite();
    if (!db || !uid) return;
    enqueue(key, () => db.collection('data/users/' + uid).doc('sheet-' + key).delete()).catch(()=>{});
  }
  function saveSched(id){
    lsWrite();
    if (!db || !uid || !state.schedule[id]) return;
    const data = JSON.parse(JSON.stringify(state.schedule[id]));
    enqueue('sched-' + id, () => db.collection('data/users/' + uid).doc('sched-' + id).set({ kind:'sched', ...data }))
      .catch(e => { toast('Saved on this phone – cloud save failed' + (e && e.code ? ' (' + e.code + ')' : '')); });
  }
  function deleteSchedRemote(id){
    lsWrite();
    if (!db || !uid) return;
    enqueue('sched-' + id, () => db.collection('data/users/' + uid).doc('sched-' + id).delete()).catch(()=>{});
  }
  function saveSettings(){
    lsWrite();
    if (!db || !uid) return;
    const data = { kind:'settings', ...state.settings };
    enqueue('settings', () => db.collection('data/users/' + uid).doc('settings').set(data)).catch(()=>{});
  }

  async function init(){
    state.profile = BC.cachedProfile();
    let local = lsRead();
    if (local){ state.sheets = local.sheets || {}; state.schedule = local.schedule || {}; state.settings = Object.assign(state.settings, local.settings || {}); }
    render();
    // cloud.js is a module, so it runs after this script: wait for the page to finish loading first
    if (!window.Cloud && document.readyState === 'loading') await new Promise(r => document.addEventListener('DOMContentLoaded', r, { once:true }));
    const cloudOn = window.Cloud ? await window.Cloud.ready : false;
    if (window.Cloud) window.Cloud.onError = e => toast('Cloud save failed' + (e && e.code ? ' (' + e.code + ')' : '') + ' – kept on this phone');
    state.cloudOn = cloudOn;
    // signing in and the technician profile live on the Blue Cranes Online home screen
    const who = await BC.requireUser(); state.profile = who.profile;
    if (!cloudOn || !who.user){ state.loaded = true; render(); return; }
    const user = who.user; state.user = user;
    // a different person signed in on this phone: don't mix in the last person's data
    const owner = (() => { try { return localStorage.getItem(LS_KEY + '-owner'); } catch(e){ return null; } })();
    if (owner && owner !== user.uid){ state.sheets = {}; state.schedule = {}; state.settings = { tech:'', assistant:'', reg:'' }; local = null; }
    try { localStorage.setItem(LS_KEY + '-owner', user.uid); } catch(e){}
    await loadCloud(user.uid, local);
    state.loaded = true; render();
  }

  async function loadCloud(id, local){
    try {
      {
        {
          db = window.Cloud; uid = id;
          const timer = setTimeout(()=>{ state.storeNote = 'No signal – saving on this phone, will sync later.'; render(); }, 10000);
          const snap = await db.collection('data/users/' + uid).get();
          clearTimeout(timer);
          snap.docs.forEach(doc => {
            const b = doc.data(); if (!b) return;
            if (b.kind === 'settings'){ state.settings = { tech:b.tech||'', assistant:b.assistant||'', reg:b.reg||'', wa:b.wa||'', waWho:b.waWho||'', services: Object.assign({}, b.services || {}), assistants: (b.assistants || []).slice(), vehicles: (b.vehicles || []).slice(), hidden: JSON.parse(JSON.stringify(b.hidden || {})) }; }
            else if (b.kind === 'sheet' && b.date){ const c = JSON.parse(JSON.stringify(b)); delete c.kind; /* stored data arrives read-only: work on a full copy */ state.sheets[b.date] = c; }
            else if (b.kind === 'sched' && b.id){ const c = JSON.parse(JSON.stringify(b)); delete c.kind; state.schedule[b.id] = c; }
          });
          // push any phone-only sheets and scheduled jobs up to the cloud
          if (local && local.sheets){ Object.keys(local.sheets).forEach(k => { if (!snap.docs.some(d=>d.id==='sheet-'+k)) saveSheet(k); }); }
          if (local && local.schedule){ Object.keys(local.schedule).forEach(id => { if (!snap.docs.some(d=>d.id==='sched-'+id)) saveSched(id); }); }
          store = 'cloud'; state.storeNote = '';
          lsWrite();
        }
      }
    } catch(e){ state.storeNote = 'Could not reach the cloud – saving on this phone.'; console.error(e); }
  }

  // ---------- helpers ----------
  function todayKey(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function curKey(){ return state.activeDate || todayKey(); }
  function keyOf(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
  function addDays(key, n){ const [y,m,d] = key.split('-').map(Number); return keyOf(new Date(y, m-1, d + n)); }
  function weekStart(key){ const [y,m,d] = key.split('-').map(Number); const dt = new Date(y, m-1, d); return addDays(key, -((dt.getDay() + 6) % 7)); }
  function schedFor(key){ return Object.values(state.schedule).filter(x => x.date === key).sort((a,b) => (a.time || '99:99').localeCompare(b.time || '99:99') || String(a.created||'').localeCompare(String(b.created||''))); }
  function newId(){ return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function niceDate(key, long){
    const [y,m,d] = key.split('-').map(Number); const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString('en-ZA', long ? { weekday:'short', day:'numeric', month:'short', year:'numeric' } : { weekday:'short', day:'numeric', month:'short' });
  }
  function fmtKm(n){ if (n === '' || n == null || isNaN(n)) return '–'; return Number(n).toLocaleString('en-ZA').replace(/,/g,' '); }
  function parseNum(s){ if (s == null) return NaN; const t = String(s).replace(/[\s,]/g,''); return t === '' ? NaN : Number(t); }
  function fmtH(h){ return (Math.round(h*10)/10).toFixed(1); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function jobHours(sh){ return (sh.jobs||[]).reduce((a,j)=>a+(Number(j.hrs)||0),0); }
  function lastOdo(sh){ let v = Number(sh.firstOdo); (sh.jobs||[]).forEach(j=>{ const o = Number(j.odo); if (!isNaN(o) && o > v) v = o; }); return v; }
  function clockHours(a,b){
    const m = s => { const r = /^(\d{1,2})[:h.]?(\d{2})$/.exec(String(s||'').trim()); if (!r) return NaN; return Number(r[1])*60+Number(r[2]); };
    const x = m(a), y = m(b); if (isNaN(x)||isNaN(y)) return NaN; let d = y - x; if (d < 0) d += 1440; return d/60;
  }

    wa:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.8 7L4 20l1.1-4A8 8 0 1 1 20 12z"/><path d="M9 9.5c.3 2 2.2 4.1 4.5 4.6l1-1.1 1.8.8"/></svg>',

    copy:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>'
  };

  let toastTimer;
  function toast(msg){
    let t = document.querySelector('.toast'); if (!t){ t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
    t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.remove(); }, 2600);
  }
  function go(view, extra){ Object.assign(state, { view }, extra||{}); render(); window.scrollTo(0,0); }

  // ---------- views ----------
  const app = document.getElementById('app');
  function techName(sh){ return (state.profile && state.profile.name) || (sh && sh.tech) || state.settings.tech || ''; }
  function headerMain(sub, title, pill){
    return `<header style="padding:14px 16px 14px;gap:12px">
      <a href="../?home=1" aria-label="My profile" style="display:flex"><img class="logo" src="${LOGO}" alt="Blue Cranes"></a>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><div class="sub">${esc(sub)}</div><h1>${esc(title)}</h1></div>
      ${pill||''}</header>`;
  }
  function headerBack(title, to){
    return `<header><button class="back" data-go="${to}" aria-label="Back">${ICON.back}</button><h1 style="font-size:28px">${esc(title)}</h1></header>`;
  }
  function tabs(active){
    return `<nav class="tabs" aria-label="Main">
      <button onclick="location.href='../?home=1'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</button>
      <button data-go="today" ${active==='today'?'aria-current="page"':''}>${ICON.sheet}Today</button>
      <button data-go="schedule" ${active==='schedule'?'aria-current="page"':''}>${ICON.cal}Schedule</button>
      <button data-go="history" ${active==='history'?'aria-current="page"':''}>${ICON.clock}History</button></nav>`;
  }
  function storeLine(){
    if (!state.loaded) return `<div class="status">Loading…</div>`;
    if (state.storeNote) return `<div class="status">${esc(state.storeNote)}</div>`;
    return `<div class="status">${store==='cloud' ? 'Saved to your account' + (navigator.onLine ? '' : ' · offline, will sync') : 'Saved on this phone only'} · App version 13 Nov (C)</div>`;
  }

  const PARTS = ['Tyres','Windows','Water','Oil','Body'];
  function condSection(c, note){
    c = c || {};
    return `<section class="card" style="display:flex;flex-direction:column;gap:12px">
          <h2>VEHICLE CHECK</h2>
          <div class="hint" style="display:flex;gap:12px;flex-wrap:wrap;color:var(--label)"><span><b>A</b> Good</span><span><b>W</b> Fine, needs attention</span><span><b>X</b> Replace</span></div>
          ${PARTS.map(k=>`<div class="cond"><span style="font-size:15px;font-weight:600" id="cl-${k}">${k}</span>
            <div class="seg" role="group" aria-labelledby="cl-${k}">${['A','W','X'].map(o=>`<button type="button" class="${o}" data-cond="${k}" data-val="${o}" aria-pressed="${c[k]===o}" aria-label="${k} ${o}">${o}</button>`).join('')}</div></div>`).join('')}
          <div class="field"><label for="condNote">What needs attention? (optional)</label><input id="condNote" value="${esc(note||'')}" style="font-size:15px;height:48px"></div>
        </section>`;
  }
  // ---- service: entered once per vehicle, km left worked out from the odometer ----
  function serviceFor(reg){ const m = state.settings.services || {}; const v = m[String(reg||'').toUpperCase()]; return (v === '' || v == null || isNaN(Number(v))) ? null : Number(v); }
  function setService(reg, km){ const m = Object.assign({}, state.settings.services || {}); m[String(reg).toUpperCase()] = km; state.settings = Object.assign({}, state.settings, { services: m }); saveSettings(); }
  function sheetService(sh){ const v = Number(sh.nextService); return (sh.nextService === '' || sh.nextService == null || isNaN(v)) ? serviceFor(sh.reg) : v; }
  function currentOdo(sh){ return sh.lastOdo ? Number(sh.lastOdo) : lastOdo(sh); }
  function kmToService(sh){ const svc = sheetService(sh); if (svc == null || sh.firstOdo === '' || sh.firstOdo == null) return null; return svc - currentOdo(sh); }
  function serviceText(left){ if (left == null) return 'Not set'; return left < 0 ? 'Overdue by ' + fmtKm(-left) + ' km' : fmtKm(left) + ' km to go'; }
  function servicePill(left){ if (left == null) return ''; const cls = left < 0 ? 'bad' : left <= 1000 ? 'warn' : 'ok'; return `<span class="pill ${cls}">Service: ${esc(serviceText(left))}</span>`; }
  function wireCond(root, target){

  function condPills(c){

  }

  // ---- remembered lists for dropdowns ----
  function knownList(kind){
    const set = new Set(); const add = v => { v = String(v || '').trim(); if (v) set.add(kind === 'vehicles' ? v.toUpperCase() : v); };
    (state.settings[kind] || []).forEach(add);
    if (kind === 'vehicles'){ add(state.settings.reg); Object.values(state.sheets).forEach(x => add(x.reg)); }
    else { add(state.settings.assistant); Object.values(state.sheets).forEach(x => add(x.assistant)); }
    const hidden = new Set(((state.settings.hidden || {})[kind]) || []);
    return Array.from(set).filter(v => !hidden.has(v)).sort((a,b)=>a.localeCompare(b));
  }
  function forget(kind, v){
    const list = (state.settings[kind] || []).filter(x => x !== v);
    const hid = Object.assign({ assistants:[], vehicles:[] }, state.settings.hidden || {});
    hid[kind] = Array.from(new Set([...(hid[kind] || []), v]));
    const patch = { [kind]: list, hidden: hid };
    if (kind === 'vehicles' && state.settings.reg === v) patch.reg = '';
    if (kind === 'assistants' && state.settings.assistant === v) patch.assistant = '';
    state.settings = Object.assign({}, state.settings, patch); saveSettings();
  }
  function remember(kind, v){
    v = String(v || '').trim(); if (kind === 'vehicles') v = v.toUpperCase(); if (!v) return false;
    const hid = (state.settings.hidden || {})[kind] || [];
    if (hid.includes(v)) state.settings = Object.assign({}, state.settings, { hidden: Object.assign({}, state.settings.hidden, { [kind]: hid.filter(x => x !== v) }) });
    const list = (state.settings[kind] || []).slice(); if (list.includes(v)) return hid.includes(v);
    list.push(v); state.settings = Object.assign({}, state.settings, { [kind]: list }); return true;
  }
  function pickField(id, label, options, current, addText, noneText){

      <select id="${id}" data-pick>${none}${opts}<option value="__new" ${addSel}>+ ${esc(addText)}</option></select>
      <input id="${id}New" placeholder="${esc(addText)}" style="display:${addSel ? 'block' : 'none'};${id === 'ireg' ? 'text-transform:uppercase' : ''}"></div>`;
  }
  function pickValue(form, id){ const sel = form.querySelector('#' + id); if (sel.value === '__new') return form.querySelector('#' + id + 'New').value.trim(); return sel.value; }
  function manageList(kind, selId, root){
    const title = kind === 'vehicles' ? 'Your vehicles' : 'Your assistants';
    const draw = () => {
      const items = knownList(kind);
      return `<div style="font-size:16px;font-weight:700">${title}</div>
        ${items.length ? items.map(v => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px">

        box.innerHTML = draw(); wire(); toast(v + ' removed');

    };

  function wirePicks(root){

  function dayBar(){
    const k = curKey(); const isToday = k === todayKey();
    return `<div class="card" style="display:flex;align-items:center;gap:10px;padding:10px 12px;flex-wrap:wrap">

  function checkDone(sh){ return !!sh && PARTS.every(x => (sh.condition||{})[x]); }

  function viewToday(){
    const key = curKey(); const sh = state.sheets[key];

          <div class="field"><label for="first">First odometer reading (km)</label><input id="first" class="num" inputmode="numeric" required value="${esc(sugg)}">

          ${svc == null ? `<div class="field"><label for="svc">Next service due at (km)</label><input id="svc" class="num" inputmode="numeric" placeholder="e.g. 90 000">
            <span class="hint">Only asked once for ${esc(sh.reg)}. The app then counts down the km left.</span></div>`

          <div id="startErr" class="warn" role="alert"></div>

      return headerMain(niceDate(key,true), 'DAILY TIME SHEET', '<span class="pill ok">Submitted</span>') + `<main>${dayBar()}
        <div class="card" style="display:flex;flex-direction:column;gap:8px">
          <div class="v">${key === todayKey() ? "Today's" : 'This'} sheet is done.</div>
          <div class="hint">${(sh.jobs||[]).length} jobs · ${fmtH(jobHours(sh))} h job card · ${fmtKm(sh.lastOdo - sh.firstOdo)} km</div></div>
        <button class="btn primary" data-pdf="${key}">${ICON.pdf} Download PDF time sheet</button>
        <button class="btn secondary" data-detail="${key}">View sheet / send on WhatsApp</button>
        <button class="btn secondary" data-reopen="${key}">Reopen to make changes</button>${storeLine()}</main>` + tabs('today');
    }
    const jobs = sh.jobs || []; const km = lastOdo(sh) - Number(sh.firstOdo);
    return headerMain(niceDate(key,true), 'DAILY TIME SHEET', '<span class="pill prog">In progress</span>') + `<main>${dayBar()}
      <section class="card grid2">
        <div><div class="k">Technician</div><div class="v">${esc(sh.tech)}</div></div>
        <div><div class="k">Assistant</div><div class="v">${esc(sh.assistant)||'–'}</div></div>
        <div><div class="k">Vehicle reg</div><div class="v">${esc(sh.reg)}</div></div>
        <div><div class="k">First odometer</div><div class="v">${fmtKm(sh.firstOdo)} km</div></div>
      </section>
      <section class="card" style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;align-items:center"><span class="k">Vehicle check</span>
          <button class="btn secondary" style="width:auto;height:36px;font-size:13px;border-width:1.5px" data-go="check">${PARTS.every(x=>(sh.condition||{})[x]) ? 'Edit' : 'Do check'}</button></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${condPills(sh.condition)}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px">
          ${sheetService(sh) == null ? '<span class="hint">Next service not set</span>' : `<span style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:0">
            <span class="k">Service</span>
            <span style="display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px;font-variant-numeric:tabular-nums"><span class="hint" style="font-size:14px">Odometer now</span><b>${fmtKm(currentOdo(sh))} km</b><span class="hint" style="font-size:14px">Service due at</span><b>${fmtKm(sheetService(sh))} km</b></span>
            ${servicePill(kmToService(sh))}</span>`}
          <button class="btn secondary" style="width:auto;height:36px;font-size:13px;border-width:1.5px" id="svcEdit">${sheetService(sh) == null ? 'Set' : 'Update'}</button></div>

      ${schedSection(key)}
      <div style="display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 0"><h2>JOBS TODAY</h2><span class="hint">${jobs.length} ${jobs.length===1?'job':'jobs'}${jobs.length ? ' · ' + jobs.filter(x=>x.done).length + ' completed' : ''}</span></div>

        : `<div class="empty">No jobs yet. Tap <b>Add job</b> when you arrive at your first job.</div>`}
      <div class="grid2" style="gap:10px">
        <div class="stat"><span class="k">Job card time</span><span class="big">${fmtH(jobHours(sh))} h</span></div>
        <div class="stat"><span class="k">Km so far</span><span class="big">${fmtKm(km)} km</span></div>

  function viewJob(){

    const prevIdx = editing ? state.jobIdx - 1 : sh.jobs.length - 1;
    const prevOdo = prevIdx >= 0 ? Number(sh.jobs[prevIdx].odo) : Number(sh.firstOdo);

    return headerBack((editing?'EDIT JOB ':(state.prefill?'START JOB ':'ADD JOB ')) + n, 'today') + `<main>

  function viewEnd(){
    const key = curKey(); const sh = state.sheets[key]; if (!sh || !checkDone(sh)) return viewToday();

    return headerBack('END OF DAY', 'today') + `<main>

  function viewInspect(){

  // ---------- schedule ----------
  // a scheduled job shows "Completed" once its time-sheet job is ticked off
  function syncSchedDone(job){
    const x = job && job.sched && state.schedule[job.sched]; if (!x) return;
    if (!!x.done === !!job.done) return;
    if (job.done) x.done = true; else delete x.done;
    saveSched(job.sched);
  }
  function schedLabel(x){ return [x.card, x.customer].filter(Boolean).join(' · ') || 'Job'; }
  function schedNote(key){
    const n = schedFor(key).filter(x => !x.addedTo).length; if (!n) return '';
    return `<div class="card" style="display:flex;align-items:center;gap:10px;font-size:14px">${ICON.cal}<span><b>${n} ${n===1?'job':'jobs'}</b> on your schedule for this day. ${n===1?'It shows':'They show'} on the time sheet once it's started.</span></div>`;
  }
  function schedSection(key){
    const due = schedFor(key).filter(x => !x.addedTo); if (!due.length) return '';
    return `<div style="display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 0"><h2>JOB SCHEDULE</h2><span class="hint">${due.length} to do</span></div>

        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">${esc(schedLabel(x))}</span>
        <span class="hint">${x.time ? esc(x.time) : 'Any time'}${x.contact ? ' · ' + esc(x.contact) : ''}${x.notes ? ' · ' + esc(x.notes) : ''}</span></span>
        <button class="btn primary" style="width:auto;height:44px;font-size:14px" data-schedto="${esc(x.id)}">${ICON.plus} Start job</button></div>`).join('')}`;
  }
  function viewSchedule(){
    const tk = todayKey(); const ws = state.schedWeek || weekStart(tk); const thisWeek = ws === weekStart(tk);
    const days = [0,1,2,3,4,5,6].map(i => addDays(ws, i));
    const total = days.reduce((a,k) => a + schedFor(k).length, 0);
    const navBtn = 'width:auto;height:44px;font-size:14px;border-width:1.5px;padding:0 12px';
    return headerMain('Week of ' + niceDate(ws), 'SCHEDULE', `<span class="pill ${total ? 'prog' : 'ok'}">${total} ${total===1?'job':'jobs'}</span>`) + `<main>
      <div class="row" style="align-items:center">
        <button class="btn secondary" style="${navBtn}" data-week="-7" aria-label="Previous week">‹ Prev</button>
        <button class="btn secondary" style="flex:1;height:44px;font-size:14px;border-width:1.5px;${thisWeek ? 'opacity:.5' : ''}" data-week="0" ${thisWeek ? 'disabled' : ''}>This week</button>
        <button class="btn secondary" style="${navBtn}" data-week="7" aria-label="Next week">Next ›</button>
      </div>
      ${days.map(k => { const items = schedFor(k); const isT = k === tk; const past = k < tk;
        return `<section class="card" style="display:flex;flex-direction:column;gap:8px;${isT ? 'border:2px solid var(--navy)' : ''}${past && !isT ? ';opacity:.75' : ''}">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <span style="font-family:Montserrat,sans-serif;font-weight:800;font-size:15px;text-transform:uppercase;color:var(--navyDeep)">${esc(niceDate(k))}${isT ? ' <span class="pill prog" style="margin-left:4px">Today</span>' : ''}</span>
            <button class="btn secondary" style="width:auto;height:40px;font-size:13px;border-width:1.5px" data-schedadd="${k}" aria-label="Add job on ${esc(niceDate(k))}">${ICON.plus} Add</button></div>
          ${items.length ? items.map(x => `<button class="job" data-schedit="${esc(x.id)}" style="padding:10px 12px">
              <span class="num-badge" style="width:auto;min-width:52px;padding:0 6px;font-size:13px;${x.addedTo ? 'background:#15703D' : ''}">${x.time ? esc(x.time) : '–'}</span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">${esc(schedLabel(x))}</span>
              ${x.contact ? `<span class="hint" style="color:var(--label)">Contact: ${esc(x.contact)}</span>` : ''}
              ${x.notes ? `<span class="hint">${esc(x.notes)}</span>` : ''}</span>
              ${x.done ? '<span class="pill ok">✓ Completed</span>' : x.addedTo ? '<span class="pill warn">On sheet</span>' : ''}</button>`).join('')

        </section>`; }).join('')}
      <button class="btn primary" data-schedadd="${thisWeek ? tk : ws}">${ICON.plus} Schedule a job</button>
      ${storeLine()}</main>` + tabs('schedule');
  }
  function viewSchedJob(){
    const editing = !!(state.schedId && state.schedule[state.schedId]);
    const x = editing ? state.schedule[state.schedId] : { date: state.schedDate || todayKey(), time:'', card:'', customer:'', notes:'' };
    return headerBack(editing ? 'EDIT JOB' : 'SCHEDULE JOB', 'schedule') + `<main>
      <form id="schedForm" style="display:flex;flex-direction:column;gap:18px">

          <div class="field"><label for="sDate">Date</label><input id="sDate" type="date" value="${esc(x.date)}" required></div>
          <div class="field"><label for="sTime">Time (optional)</label><input id="sTime" type="time" value="${esc(x.time||'')}"></div>
        </div>
        <div class="field"><label for="sCard">Job card no.</label><input id="sCard" value="${esc(x.card)}"></div>
        <div class="field"><label for="sCust">Customer</label><input id="sCust" autocomplete="organization" value="${esc(x.customer)}"></div>

        <div class="field"><label for="sNotes">Notes (optional)</label><textarea id="sNotes" rows="3" placeholder="e.g. Load test on 5 t hoist, ask for Johan">${esc(x.notes)}</textarea></div>
        ${editing && x.addedTo ? `<div class="card" style="font-size:14px;display:flex;flex-direction:column;gap:8px"><span>Added to the time sheet for <b>${esc(niceDate(x.addedTo))}</b>.</span>
          <button type="button" class="btn secondary" style="height:44px;font-size:14px;border-width:1.5px" id="sUndone">Mark as not done</button></div>` : ''}
        <div id="schedErr" class="warn" role="alert"></div>
        <button class="btn primary" type="button" data-submit>${editing ? 'Save changes' : 'Save to schedule'}</button>
        ${editing ? `<button class="btn ghost" type="button" id="sDel">Delete from schedule</button>` : ''}
      </form></main>`;
  }

  function viewCheck(gate){
    const key = curKey(); const sh = state.sheets[key]; if (!sh) return viewToday();
    if (!checkDone(sh)) return viewInspect(); gate = false;
    if (!state._editCond || state._editCondKey !== key + (gate?'g':'e')){ state._editCond = Object.assign({}, sh.condition || {}); state._editCondKey = key + (gate?'g':'e'); }
    const head = gate
      ? headerMain(niceDate(key,true), 'VEHICLE CHECK', '<span class="pill prog">Step 2 of 2</span>')
      : headerBack('VEHICLE CHECK', 'today');
    return head + `<main>${gate ? dayBar() : ''}
      ${gate ? `<div class="card" style="font-size:14px;line-height:1.4"><b>${esc(sh.reg)}</b> · ${fmtKm(sh.firstOdo)} km<br>Check the vehicle before you start. Jobs open once all five parts are rated.</div>` : ''}
      <form id="checkForm" style="display:flex;flex-direction:column;gap:16px">
        ${condSection(state._editCond, sh.condNote)}
        <div id="checkErr" class="warn" role="alert"></div>
        <button class="btn primary" type="button" data-submit>${gate ? 'Done – start jobs' : 'Save vehicle check'}</button>
        ${gate ? `<button class="btn secondary" type="button" id="backStart">Back – fix name, reg or odometer</button>` : ''}
      </form></main>` + (gate ? tabs('today') : '');
  }

  function viewHistory(){
    const keys = Object.keys(state.sheets).sort().reverse();
    const now = new Date(); const ym = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    const month = keys.filter(k=>k.startsWith(ym)).map(k=>state.sheets[k]);
    const mKm = month.reduce((a,s)=>a+((s.lastOdo? Number(s.lastOdo):lastOdo(s)) - Number(s.firstOdo) || 0),0);
    const mH = month.reduce((a,s)=>a+jobHours(s),0);
    return headerMain(now.toLocaleDateString('en-ZA',{month:'long',year:'numeric'}), 'HISTORY', '') + `<main>
      <div class="grid3">
        <div class="card" style="padding:10px 12px"><div class="k">Sheets</div><div class="big" style="font-size:24px">${month.length}</div></div>
        <div class="card" style="padding:10px 12px"><div class="k">Km</div><div class="big" style="font-size:24px">${fmtKm(mKm)}</div></div>
        <div class="card" style="padding:10px 12px"><div class="k">Job hrs</div><div class="big" style="font-size:24px">${fmtH(mH)}</div></div>
      </div>
      <a class="btn" href="../forklift/?reports=1" style="background:var(--navyDeep);color:#fff;text-decoration:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18V6h5l3 6v6"/><path d="M12 12h3"/><path d="M17 4v14h4"/><circle cx="6" cy="19" r="2"/><circle cx="12" cy="19" r="2"/></svg> Forklift reports &amp; certificates</a>
      ${keys.length ? keys.map(k=>{ const s = state.sheets[k]; const f = condFlags(s);
        const km = (s.lastOdo? Number(s.lastOdo):lastOdo(s)) - Number(s.firstOdo);
        let pill = s.status!=='submitted' ? '<span class="pill prog">In progress</span>' : f.x.length ? `<span class="pill bad">X · ${esc(f.x.join(', '))}</span>` : f.w.length ? `<span class="pill warn">W · ${esc(f.w.join(', '))}</span>` : '<span class="pill ok">All A</span>';
        return `<button class="job" data-detail="${k}" style="flex-direction:column;align-items:stretch;gap:8px">
          <span style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font-size:15px;font-weight:700">${esc(niceDate(k))}</span>${pill}</span>
          <span class="hint" style="display:flex;gap:14px;color:var(--label)"><span>${(s.jobs||[]).length} jobs</span><span>${fmtH(jobHours(s))} h job card</span><span>${fmtKm(km)} km</span></span></button>`; }).join('')
        : `<div class="empty">No time sheets yet.</div>`}
      ${accountCard()}
      ${storeLine()}</main>` + tabs('history');
  }

  // ---------- account, backup, install ----------
  let installEvt = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (state.view === 'history') render(); });
  const standalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
  function accountCard(){
    const u = state.user;
    return `<section class="card" style="display:flex;flex-direction:column;gap:10px">
      <h2>ACCOUNT &amp; DATA</h2>
      ${u ? `<div style="font-size:14px;min-width:0;word-break:break-all">Signed in as <b>${esc(u.email)}</b>. Profile and sign out: tap <b>Profile</b> below.</div>`
        : `<div class="hint">${state.cloudOn ? 'Not signed in.' : 'Cloud saving is not set up yet, so your data is only on this phone. Make a backup now and then.'}</div>`}
      <div class="row">
        <button class="btn secondary" style="height:46px;font-size:14px;border-width:1.5px" id="backupBtn">Back up data</button>
        <button class="btn secondary" style="height:46px;font-size:14px;border-width:1.5px" id="restoreBtn">Restore backup</button>
      </div>
      <input type="file" id="restoreFile" accept="application/json,.json" style="display:none">
      <span class="hint">A backup is one file with all your time sheets, schedule and settings. Restore it to bring your data into this app (also from the old Claude version).</span>
    </section>`;
  }
  function backupData(){ return { app:'blue-cranes-daily-time-sheet', version:1, exported:new Date().toISOString(), sheets:state.sheets, schedule:state.schedule, settings:state.settings }; }
  async function doBackup(){
    const blob = new Blob([JSON.stringify(backupData(), null, 1)], { type:'application/json' });
    try { const how = await saveFile(blob, 'Time sheet backup ' + todayKey() + '.json', 'application/json', 'Time sheet backup'); if (how) toast('Backup made'); }
    catch(e){ toast('Backup failed'); }
  }
  function doRestore(file){
    const r = new FileReader();
    r.onload = () => {
      let b; try { b = JSON.parse(r.result); } catch(e){ toast('That file is not a time sheet backup'); return; }
      if (!b || typeof b !== 'object' || (!b.sheets && !b.schedule)){ toast('That file is not a time sheet backup'); return; }
      const ns = Object.keys(b.sheets || {}).length, nj = Object.keys(b.schedule || {}).length;
      confirmBox(`Restore ${ns} time ${ns===1?'sheet':'sheets'} and ${nj} scheduled ${nj===1?'job':'jobs'}? Items with the same date or job are replaced by the backup.`, 'Restore', () => {
        Object.entries(b.sheets || {}).forEach(([k, v]) => { if (/^\d{4}-\d{2}-\d{2}$/.test(k) && v && typeof v === 'object'){ state.sheets[k] = Object.assign({}, v, { date:k }); saveSheet(k); } });
        Object.entries(b.schedule || {}).forEach(([id, v]) => { if (v && typeof v === 'object'){ state.schedule[id] = Object.assign({}, v, { id }); saveSched(id); } });
        if (b.settings && typeof b.settings === 'object'){ state.settings = Object.assign({}, state.settings, b.settings); saveSettings(); }
        toast('Backup restored'); render();
      });
    };
    r.readAsText(file);
  }

  function viewSignIn(){
    const mode = state.authMode || 'in';
    return `<header style="flex-direction:column;align-items:center;gap:10px;padding:28px 16px 20px;text-align:center">
        <img class="logo" src="${LOGO}" alt="Blue Cranes" style="width:84px;height:84px">
        <div class="sub">Blue Cranes</div><h1>DAILY TIME SHEET</h1></header>
      <main>
        <form id="authForm" class="card" style="display:flex;flex-direction:column;gap:14px">
          <h2>${mode === 'up' ? 'CREATE ACCOUNT' : mode === 'reset' ? 'RESET PASSWORD' : 'SIGN IN'}</h2>
          <div class="field"><label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email" inputmode="email" value="${esc(state.authEmail||'')}"></div>
          ${mode === 'reset' ? '' : `<div class="field"><label for="aPw">Password</label><input id="aPw" type="password" autocomplete="${mode==='up'?'new-password':'current-password'}">
            ${mode === 'up' ? '<span class="hint">At least 6 characters.</span>' : ''}</div>`}
          <div id="authErr" class="warn" role="alert"></div>
          <button class="btn primary" type="button" data-submit>${mode === 'up' ? 'Create account' : mode === 'reset' ? 'Send reset email' : 'Sign in'}</button>
          ${mode === 'in' ? `<button class="btn secondary" type="button" data-auth="up">New here? Create an account</button>
            <button type="button" data-auth="reset" style="border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;font-family:inherit;padding:10px;cursor:pointer">Forgot password?</button>`
            : `<button class="btn secondary" type="button" data-auth="in">Back to sign in</button>`}
        </form>
        <div class="status">Your time sheets are saved to your account and work offline.</div>
      </main>`;
  }
  function authMessage(e){
    const c = (e && e.code) || '';
    if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'Email or password is wrong.';
    if (c.includes('email-already-in-use')) return 'There is already an account with this email. Sign in instead.';
    if (c.includes('weak-password')) return 'Password must be at least 6 characters.';
    if (c.includes('invalid-email')) return 'That email address doesn\'t look right.';
    if (c.includes('network')) return 'No signal. Sign in needs internet the first time.';
    if (c.includes('too-many-requests')) return 'Too many tries. Wait a few minutes and try again.';
    if (c.includes('operation-not-allowed')) return 'Email sign-in is not switched on in Firebase yet (see the setup steps).';
    return 'Something went wrong' + (c ? ' (' + c + ')' : '') + '.';
  }

  function summaryText(k){
    const s = state.sheets[k]; const L = [];
    L.push('DAILY TIME SHEET – ' + niceDate(k,true));
    L.push('Technician: ' + (s.tech||'')); L.push('Assistant: ' + (s.assistant||'–')); L.push('Vehicle reg: ' + (s.reg||''));
    L.push('First odometer: ' + fmtKm(s.firstOdo) + ' km'); L.push('');
    (s.jobs||[]).forEach((j,i)=>{ L.push(`Job ${i+1}: ${[j.card,j.customer||j.desc].filter(Boolean).join(' – ')} | ${fmtH(Number(j.hrs)||0)} h | odo ${fmtKm(j.odo)} km${j.notes?' | '+j.notes:''}`); });
    L.push('');
    const last = s.lastOdo || lastOdo(s);
    L.push('Last odometer: ' + fmtKm(last) + ' km');
    const ch = clockHours(s.clockIn, s.clockOut);
    L.push('Clock time: ' + (isNaN(ch)?'–':fmtH(ch)+' h' + ` (${s.clockIn}–${s.clockOut})`));
    L.push('Job card time: ' + fmtH(jobHours(s)) + ' h');
    L.push('Km travelled: ' + fmtKm(last - Number(s.firstOdo)));
    const c = s.condition||{};
    L.push(''); L.push('Vehicle condition: ' + ['Tyres','Windows','Water','Oil','Body'].map(x=>x+' '+(c[x]||'–')).join(', '));
    if (s.condNote) L.push('Notes: ' + s.condNote);
    L.push('Next service due: ' + (sheetService(s) != null ? fmtKm(sheetService(s))+' km (' + serviceText(kmToService(s)) + ')' : '–'));
    return L.join('\n');
  }

  function viewDetail(){
    const k = state.detailKey; const s = state.sheets[k]; if (!s) return viewHistory();
    const last = s.lastOdo || lastOdo(s); const ch = clockHours(s.clockIn, s.clockOut); const c = s.condition||{};

  // ---------- PDF in the layout of the paper Daily Time Sheet ----------
  let jsPdfLoading = null;
  function loadJsPdf(){
    if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
    if (jsPdfLoading) return jsPdfLoading;
    const srcs = ['../vendor/jspdf.umd.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js', 'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'];
    jsPdfLoading = srcs.reduce((p, src) => p.then(() => {
      if (window.jspdf && window.jspdf.jsPDF) return;
      return new Promise(res => { const sc = document.createElement('script'); sc.src = src; sc.onload = () => res(); sc.onerror = () => res(); document.head.appendChild(sc); setTimeout(res, 15000); });
    }), Promise.resolve()).then(() => { jsPdfLoading = null; if (!(window.jspdf && window.jspdf.jsPDF)) throw new Error('The PDF maker could not be downloaded – check your signal.'); });
    return jsPdfLoading;
  }
  // Phones: open the share sheet (WhatsApp, Files, email…). Elsewhere: a normal download.
  async function saveFile(blob, name, type, title){
    const file = new File([blob], name, { type });
    if (navigator.canShare && navigator.share && navigator.canShare({ files:[file] })){
      try { await navigator.share({ files:[file], title }); return 'shared'; }
      catch(e){ if (e && e.name === 'AbortError') return null; /* fall through to download */ }
    }
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000); return 'downloaded';
  }
  function pdfProblem(msg, e){
    const detail = e ? [e.code, e.message].filter(Boolean).join(' – ') : '';
    const m = modal(`<div style="font-size:16px;font-weight:700">PDF problem</div><div style="font-size:14px;line-height:1.45">${esc(msg)}</div>
      ${detail ? `<div class="hint" style="word-break:break-word">Details for Claude: ${esc(detail)}</div>` : ''}<button class="btn secondary" id="mClose">Close</button>`);
    m.querySelector('#mClose').onclick = () => m.remove();
  }

  async function makePdf(k, btn){
    const s = state.sheets[k]; if (!s) return;
    const old = btn ? btn.innerHTML : ''; if (btn){ btn.disabled = true; btn.textContent = 'Making PDF…'; }
    let stage = 'loading the PDF maker';
    try {
      await loadJsPdf();
      stage = 'drawing the time sheet';
      const doc = new window.jspdf.jsPDF({ unit:'mm', format:'a4' });
      const L = 15, R = 195, W = R - L, GREY = 215;
      const cut = (t, w) => { const lines = doc.splitTextToSize(String(t||''), w); return lines.length ? lines[0] + (lines.length > 1 ? '…' : '') : ''; };
      const lineField = (label, value, x, y, x2, lineStart) => {
        doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.text(label, x, y);
        doc.setLineWidth(0.3); doc.line(lineStart, y + 1, x2, y + 1);
        doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text(cut(value, x2 - lineStart - 2), lineStart + 2, y - 0.5);
      };
      // Title
      try { doc.addImage(LOGO_PDF, 'JPEG', 13, 4, 22, 22); } catch(_) {}
      doc.setTextColor(11, 53, 117);
      doc.setFont('helvetica','bold'); doc.setFontSize(22); doc.text('DAILY TIME SHEET', 105, 20, { align:'center' });
      doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.text('Blue Cranes – Material Handling & Lifting Equipment', 105, 26.5, { align:'center' });
      doc.setTextColor(0, 0, 0);
      doc.setDrawColor(251, 210, 32); doc.setLineWidth(0.9); doc.line(70, 22, 140, 22); doc.setDrawColor(0, 0, 0);
      // Header fields
      lineField('Technician Name:', s.tech, L, 33, R, 70);
      lineField('Assistant Name:', s.assistant || '', L, 41, R, 70);
      lineField('Vehicle Registration no:', s.reg, L, 49, 120, 70);
      lineField('Date:', niceDate(k, true), 125, 49, R, 137);
      // First odometer
      let y = 56; doc.setLineWidth(0.5);
      doc.setFillColor(GREY); doc.rect(L, y, 115, 8, 'F'); doc.rect(L, y, W, 8);
      doc.line(L + 115, y, L + 115, y + 8);
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('FIRST ODOMETER READING:', L + 2, y + 5.5);
      doc.text(fmtKm(s.firstOdo) + ' km', R - 3, y + 5.5, { align:'right' });
      // Jobs
      const jobs = s.jobs || []; const rows = Math.max(7, jobs.length);
      const top = y + 8, area = 118, rowH = area / rows, band = Math.min(6, rowH * 0.42);
      const c1 = L, c2 = 110, c3 = 140;
      doc.setLineWidth(0.5); doc.rect(L, top, W, area);
      for (let i = 0; i < rows; i++){
        const ry = top + i * rowH; const j = jobs[i];
        doc.setFillColor(GREY); doc.rect(L, ry, W, band, 'F');
        doc.setLineWidth(0.3); doc.line(L, ry, R, ry); doc.line(L, ry + band, R, ry + band);
        doc.setFont('helvetica','normal'); doc.setFontSize(9);
        doc.text('JOB:', c1 + 2, ry + band - 1.6);
        if (j && j.card){ doc.setFont('helvetica','bold'); doc.text(cut(j.card, c2 - c1 - 40), c1 + 11, ry + band - 1.6); doc.setFont('helvetica','normal'); }
        if (j){ doc.setFont('helvetica','bold'); doc.setFontSize(8);
          if (j.done){ doc.setTextColor(21, 112, 61); doc.text('COMPLETED', c2 - 2, ry + band - 1.6, { align:'right' }); }
          else { doc.setTextColor(138, 90, 0); doc.text('NOT FINISHED', c2 - 2, ry + band - 1.6, { align:'right' }); }
          doc.setTextColor(0, 0, 0); doc.setFont('helvetica','normal'); doc.setFontSize(9); } doc.text('HRS:', c2 + 2, ry + band - 1.6); doc.text('ODOMETER', (c3 + R) / 2, ry + band - 1.6, { align:'center' });
        if (j){
          const vy = ry + band + (rowH - band) / 2 + 1.5;
          doc.setFont('helvetica','bold'); doc.setFontSize(rowH < 12 ? 9 : 10.5);
          doc.text(cut(j.customer || j.desc || '', c2 - c1 - 4), c1 + 2, vy);
          doc.text(fmtH(Number(j.hrs) || 0) + ' h', (c2 + c3) / 2, vy, { align:'center' });
          doc.text(fmtKm(j.odo) + ' km', (c3 + R) / 2, vy, { align:'center' });
        }
      }
      doc.setLineWidth(0.3); doc.line(c2, top, c2, top + area); doc.line(c3, top, c3, top + area);
      // Last odometer
      y = top + area + 6; const last = s.lastOdo || lastOdo(s);
      doc.setLineWidth(0.5); doc.setFillColor(GREY); doc.rect(L, y, 115, 8, 'F'); doc.rect(L, y, W, 8); doc.line(L + 115, y, L + 115, y + 8);
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('LAST ODOMETER READING:', L + 2, y + 5.5);
      doc.text(s.lastOdo ? fmtKm(s.lastOdo) + ' km' : '', R - 3, y + 5.5, { align:'right' });
      // Times
      y += 17; const ch = clockHours(s.clockIn, s.clockOut);
      lineField('CLOCK TIME:', isNaN(ch) ? '' : fmtH(ch) + ' h', L, y, 108, 42);
      lineField('JOB CARD TIME:', fmtH(jobHours(s)) + ' h', 113, y, R, 145);
      y += 9;
      lineField('KM TRAVELED:', s.lastOdo ? fmtKm(last - Number(s.firstOdo)) + ' km' : '', L, y, 108, 42);
      // Vehicle condition
      y += 7; const bh = 287 - y; const c = s.condition || {};
      doc.setLineWidth(0.5); doc.rect(L, y, W, bh);
      doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text('VEHICLE CONDITION', 105, y + 7, { align:'center' }); doc.setLineWidth(0.3); doc.line(83, y + 8, 127, y + 8);
      doc.setFontSize(9.5); doc.setFont('helvetica','normal'); doc.text('Key:', L + 3, y + 14);
      [['A','Good condition'],['W','Fine but needs attention'],['X','Replacement']].forEach(([a,b],i)=>{ doc.setFont('helvetica','bold'); doc.text(a, L + 17, y + 14 + i*4.5); doc.setFont('helvetica','normal'); doc.text(b, L + 24, y + 14 + i*4.5); });
      const svcKm = sheetService(s), left = kmToService(s);
      lineField('Next Service Due:', svcKm != null ? fmtKm(svcKm) + ' km' : '', 112, y + 15, R - 3, 143);
      lineField('Km left to service:', left == null ? '' : (left < 0 ? 'OVERDUE ' + fmtKm(-left) + ' km' : fmtKm(left) + ' km') + (left == null ? '' : '  (at ' + fmtKm(currentOdo(s)) + ' km)'), 112, y + 23, R - 3, 146);
      const gy = y + 30, gap = Math.min(9, (bh - 34) / 3);
      lineField('TYRES:', c.Tyres || '', L + 3, gy, 100, 33); lineField('WINDOWS:', c.Windows || '', 108, gy, R - 3, 130);
      lineField('WATER:', c.Water || '', L + 3, gy + gap, 100, 33); lineField('OIL:', c.Oil || '', 108, gy + gap, R - 3, 130);
      lineField('BODY:', [c.Body || '', s.condNote ? '– ' + s.condNote : ''].join(' ').trim(), L + 3, gy + gap * 2, R - 3, 33);

      stage = 'preparing the file';
      const blob = doc.output('blob');
      stage = 'saving the file';
      const fname = `Time sheet ${s.reg || ''} ${k}.pdf`.replace(/\s+/g,' ');
      try { const how = await saveFile(blob, fname, 'application/pdf', 'Time sheet ' + niceDate(k, true)); if (how) toast(how === 'shared' ? 'PDF ready to send' : 'PDF downloaded'); return !!how; }
      catch(e){ pdfProblem('The PDF was made but could not be saved.', e); return false; }
    } catch(e){ pdfProblem('Something went wrong while ' + stage + '.', e); return false; }
    finally { if (btn){ btn.disabled = false; btn.innerHTML = old; } }
  }

  function modal(html){
    const bg = document.createElement('div'); bg.className='modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
    bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
    document.body.appendChild(bg); const f = bg.querySelector('button'); if (f) f.focus();
    return bg;
  }

    });

    const dp = document.getElementById('dayPick');
    if (dp) dp.onchange = () => { const v = dp.value; if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return; state.activeDate = (v === todayKey()) ? null : v; state._editCond = null; go('today'); };
    const dt = document.getElementById('dayToday');
    if (dt) dt.onclick = () => { state.activeDate = null; state._editCond = null; go('today'); };
    app.querySelectorAll('[data-pdf]').forEach(b => b.onclick = () => makePdf(b.dataset.pdf, b));
    const waSend = document.getElementById('waSend');
    if (waSend){
      const k = waSend.dataset.wa; const sh = state.sheets[k];
      const prev = document.getElementById('waPreview');
      const who = () => { const r = app.querySelector('input[name="waWho"]:checked'); return r ? r.value : 'tech'; };
      const message = () => {
        const L = ['*' + niceDate(k, true) + '*', sh.tech || ''];
        if (who() === 'both' && sh.assistant) L.push(sh.assistant);
        L.push('Time in: ' + (sh.clockIn || '–'), 'Time out: ' + (sh.clockOut || '–'));
        return L.join('\n');
      };
      const refresh = () => {
        const msg = message(); prev.textContent = msg.replace(/\*/g, '');
        waSend.href = 'https://wa.me/?text=' + encodeURIComponent(msg);
      };
      app.querySelectorAll('input[name="waWho"]').forEach(r => r.addEventListener('change', () => { refresh(); state.settings = Object.assign({}, state.settings, { waWho: who() }); saveSettings(); }));
      refresh();
    }

    const sf = document.getElementById('startForm');
    if (sf) sf.onsubmit = e => {
      e.preventDefault();
      const k = curKey(); const sh = state.sheets[k];
      const tech = sf.tech.value.trim(), assistant = pickValue(sf, 'assistant'), first = parseNum(sf.first.value);
      const err = document.getElementById('startErr');
      if (!tech){ err.textContent = 'Fill in the technician name.'; return; }
      if (sf.querySelector('#assistant').value === '__new' && !assistant){ err.textContent = 'Type the new assistant\'s name, or pick one from the list.'; return; }
      const addedA = remember('assistants', assistant);
      if (isNaN(first) || first < 0){ err.textContent = 'Enter the first odometer reading as a number.'; return; }
      let svc = serviceFor(sh.reg);
      if (sf.svc){
        const v = parseNum(sf.svc.value);
        if (isNaN(v)){ err.textContent = 'Enter the km reading when the next service is due (once only).'; return; }
        if (v <= first){ err.textContent = 'Service km must be higher than the odometer reading.'; return; }
        svc = v;
      }
      Object.assign(sh, { tech, assistant, firstOdo:first, nextService: svc == null ? '' : svc });
      const changed = tech!==state.settings.tech || assistant!==state.settings.assistant || sh.reg!==state.settings.reg;
      state.settings = Object.assign({}, state.settings, { tech, assistant, reg: sh.reg });
      if (sf.svc) setService(sh.reg, svc); else if (changed || addedA) saveSettings();
      saveSheet(k); go('today');
    };

    if (sf){
      wirePicks(sf);
      const tc = document.getElementById('techChange');
      if (tc) tc.onclick = () => { const t = sf.tech; t.type = 'text'; t.style.cssText = 'height:52px;border-radius:10px;border:1.5px solid var(--field);padding:0 14px;font-size:17px;font-family:inherit;width:100%'; t.setAttribute('aria-label','Technician name'); tc.parentNode.remove(); t.focus(); t.select(); };
    }
    const bi = document.getElementById('backInspect');
    if (bi) bi.onclick = () => { const k = curKey(); const sh = state.sheets[k]; state._editCond = Object.assign({}, sh.condition || {}); state._editCondKey = k + 'i'; sh.condition = {}; go('today'); };

    const inf = document.getElementById('inspectForm');
    if (inf){
      wireCond(inf, state._editCond); wirePicks(inf);
      inf.onsubmit = () => {
        const k = curKey(); const err = document.getElementById('inspErr');
        const reg = String(pickValue(inf, 'ireg') || '').trim().toUpperCase();
        if (!reg){ err.textContent = 'Choose the vehicle, or add a new one.'; return; }
        if (remember('vehicles', reg) || reg !== state.settings.reg){ state.settings = Object.assign({}, state.settings, { reg }); saveSettings(); }
        const missing = PARTS.filter(x => !state._editCond[x]);
        if (missing.length){ err.textContent = 'Rate ' + missing.join(', ') + '.'; return; }
        const sh = state.sheets[k] || { date:k, tech:'', assistant:'', firstOdo:'', jobs:[], status:'open' };
        Object.assign(sh, { reg, condition:Object.assign({}, state._editCond), condNote:inf.condNote.value.trim() });
        state.sheets[k] = sh; state._editCond = null; state._editCondKey = null;
        saveSheet(k); go('today');
      };
    }

    const se = document.getElementById('svcEdit');
    if (se) se.onclick = () => {
      const k = curKey(); const sh = state.sheets[k]; const cur = sheetService(sh);
      const m = modal(`<div style="font-size:16px;font-weight:700">Next service for ${esc(sh.reg)}</div>
        <div class="field"><label for="mSvc">Next service due at (km)</label><input id="mSvc" class="num" inputmode="numeric" value="${cur == null ? '' : esc(cur)}"></div>
        <span class="hint">Change this after the vehicle has been serviced.</span>
        <div id="mErr" class="warn" role="alert"></div>
        <button class="btn primary" id="mSave">Save</button><button class="btn secondary" id="mNo">Cancel</button>`);
      m.querySelector('#mNo').onclick = () => m.remove();
      m.querySelector('#mSave').onclick = () => {
        const v = parseNum(m.querySelector('#mSvc').value);
        if (isNaN(v)){ m.querySelector('#mErr').textContent = 'Enter a km reading.'; return; }
        setService(sh.reg, v); sh.nextService = v; saveSheet(k); m.remove(); toast('Service km saved'); render();
      };
    };

    const jf = document.getElementById('jobForm');
    if (jf){
      const val = document.getElementById('hrsVal');
      document.getElementById('minus').onclick = () => { state._hrs = Math.max(0, state._hrs - 0.5); val.textContent = fmtH(state._hrs)+' h'; };
      document.getElementById('plus').onclick = () => { state._hrs = Math.min(24, state._hrs + 0.5); val.textContent = fmtH(state._hrs)+' h'; };
      const del = document.getElementById('delJob');
      if (del) del.onclick = () => confirmBox('Delete job ' + (state.jobIdx+1) + '?', 'Delete job', () => {
        const k = curKey(); const gone = state.sheets[k].jobs.splice(state.jobIdx,1)[0];
        if (gone && gone.sched && state.schedule[gone.sched]){ delete state.schedule[gone.sched].addedTo; delete state.schedule[gone.sched].done; saveSched(gone.sched); }
        saveSheet(k); go('today', { jobIdx:null });
      });
      jf.onsubmit = e => {
        e.preventDefault();
        const k = curKey(); const sh = state.sheets[k]; const err = document.getElementById('jobErr');
        const odo = parseNum(jf.odo.value);
        if (!jf.card.value.trim() && !jf.customer.value.trim()){ err.textContent = 'Add a job card no. or a customer.'; return; }
        if (isNaN(odo)){ err.textContent = 'Enter the odometer reading as a number.'; return; }
        if (odo < Number(sh.firstOdo)){ err.textContent = 'That reading is lower than this morning\'s first reading (' + fmtKm(sh.firstOdo) + ' km). Check the number.'; return; }
        const job = { card: jf.card.value.trim(), customer: jf.customer.value.trim(), odo, hrs: state._hrs, notes: jf.notes.value.trim(), done: !!state._done };
        if (state.jobIdx != null){ const was = sh.jobs[state.jobIdx];
          if (was && was.sched){ Object.assign(job, { sched: was.sched, card: was.card || '', customer: was.customer || '', contact: was.contact || '' }); }
          if (was && was.done && job.done) job.doneAt = was.doneAt;
          sh.jobs[state.jobIdx] = job; }
        else {
          const sid = state.prefill && state.schedule[state.prefill] ? state.prefill : null;
          if (sid){ const src = state.schedule[sid]; Object.assign(job, { sched: sid, card: src.card || '', customer: src.customer || '', contact: src.contact || '' }); src.addedTo = k; saveSched(sid); }
          sh.jobs.push(job);
        }
        if (job.done && !job.doneAt) job.doneAt = new Date().toISOString();
        if (!job.done) delete job.doneAt;
        syncSchedDone(job);
        saveSheet(k); toast('Job saved'); go('today', { jobIdx:null, prefill:null });
      };
    }

    const cf = document.getElementById('checkForm');
    if (cf){
      wireCond(cf, state._editCond);
      cf.onsubmit = e => {
        const k = curKey(); const sh = state.sheets[k];
        const missing = PARTS.filter(x => !state._editCond[x]);
        if (missing.length){ document.getElementById('checkErr').textContent = 'Rate ' + missing.join(', ') + '.'; return; }
        Object.assign(sh, { condition:Object.assign({}, state._editCond), condNote:cf.condNote.value.trim() });
        state._editCond = null; state._editCondKey = null;
        saveSheet(k); toast('Vehicle check saved'); go('today');
      };
    }

    const ef = document.getElementById('endForm');
    if (ef){
      const k = curKey(); const sh = state.sheets[k];
      sh.condition = sh.condition || {};
      const upd = () => {
        const l = parseNum(ef.lastOdo.value); const km = l - Number(sh.firstOdo);
        document.getElementById('sKm').textContent = isNaN(km) ? '–' : fmtKm(km);
        const ch = clockHours(ef.cin.value, ef.cout.value);
        document.getElementById('sClock').textContent = isNaN(ch) ? '–' : fmtH(ch) + ' h';
        const svc = sheetService(sh); document.getElementById('sSvc').textContent = (svc == null || isNaN(l)) ? (svc == null ? 'Not set' : '–') : serviceText(svc - l);
        document.getElementById('sSvcLine').textContent = svc == null ? '' : 'Odometer now ' + (isNaN(l) ? '–' : fmtKm(l)) + ' km · Service due at ' + fmtKm(svc) + ' km';
      };
      ef.lastOdo.oninput = upd; ef.cin.oninput = upd; ef.cout.oninput = upd; upd();
      ef.onsubmit = e => {
        e.preventDefault(); const err = document.getElementById('endErr');
        const l = parseNum(ef.lastOdo.value);
        if (isNaN(l)){ err.textContent = 'Enter the last odometer reading.'; return; }
        if (l < lastOdo(sh)){ err.textContent = 'Last reading is lower than a job reading today (' + fmtKm(lastOdo(sh)) + ' km). Check the number.'; return; }
        if (!ef.cin.value || !ef.cout.value){ err.textContent = 'Fill in clock in and clock out.'; return; }
        const missing = PARTS.filter(x => !sh.condition[x]);
        if (missing.length){ err.textContent = 'The vehicle check isn\'t done yet – go back and tap "Do check" on the Today screen.'; return; }
        Object.assign(sh, { lastOdo:l, clockIn:ef.cin.value, clockOut:ef.cout.value, status:'submitted', submittedAt:new Date().toISOString() });
        saveSheet(k); toast('Time sheet submitted'); go('detail', { detailKey:k });
      };
    }
  }

  // Forms are run from button clicks, not native submit: the page's frame may block form submission.
  function wireForms(){
    app.querySelectorAll('form').forEach(f => {
      const run = () => { if (typeof f.onsubmit === 'function') f.onsubmit({ preventDefault(){} }); };
      const btn = f.querySelector('[data-submit]'); if (btn) btn.addEventListener('click', run);
      f.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT'){ e.preventDefault(); run(); } });
    });
  }
  const _render = render;
  render = function(){ _render(); wireForms(); };

  window.addEventListener('online', () => { if (state.loaded) render(); });
  window.addEventListener('offline', () => { if (state.loaded) render(); });
  init();
})();
</script>
</body>
</html>
